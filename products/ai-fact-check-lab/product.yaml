description: |
  NO STUDENT AI ACCOUNTS NEEDED — this lesson runs fully on paper. The hook: you read a smooth, confident paragraph aloud, the class votes to print it — then you reveal the two planted errors nobody caught; in The Fact Desk, students check three AI-helped drafts for the school paper and stamp each one RUN, FIX, or KILL. Smooth is not the same as true.

  This no-prep, 45-minute lesson teaches WHY AI "hallucinates" — it predicts likely words, so it can be confidently wrong — and gives students a four-step fact-desk method they'll use for life: underline the checkable claims (names, dates, numbers, places, quotes), rank them by risk, lateral-read the risky ones by naming a second, independent source, then stamp a verdict with evidence.

  In The Fact Desk, pairs work three short AI-style draft passages with errors planted in verifiable territory (astronomy, geography, invention history) — including a fabricated quote that sounds completely real. They underline claims, mark each C (check) or S (safe), name where they'd check, and write a note to the writer: what's wrong, the second source, and whether the ending still stands. On paper, students name the second source they would check; with devices, they open it.

  INCLUDES: a scripted 45-minute lesson plan (2 pages: every block timed, every transition written, a what-if under every block); The Fact Desk worksheet (3 pages: three passages, verdict tick boxes, exit ticket) plus a typeable (fillable) PDF copy for Chromebooks and tablets; a teacher guide (3 pages) with a key for every student item — every planted error with the true fact, a second-source key per draft, verdict guidance with an exemplar note, and the exit ticket key — plus a when-it-goes-sideways panel; a projectable slide deck (.pptx, 12 slides, teacher script and answer keys in the speaker notes; opens in PowerPoint, Keynote, Google Slides); and Support / Extension / ELL / no-device variants built in. Works with any AI tool or none. Zero prep: print and teach the same morning.

  Standards: CCSS ELA RI.6.8, ISTE 1.3.b, ISTE 1.3.d — with a taught/assessed map for every code in the teacher guide.

  Lesson 3 of 6 in the AI Literacy unit — stands alone; the 6-lesson bundle saves 30%.
