description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  AI predicts likely words, and it doesn't always check them. Smooth is not the same as true.

  At The Fact Desk, your students check three AI-helped drafts for the school paper and stamp each one RUN, FIX, or KILL.

  You open by reading a smooth, confident paragraph aloud, and the class votes to print it. Then you reveal the two planted errors most of the room missed. That is the whole case for fact-checking AI, made in the first six minutes. Next, the class plays autocomplete out loud and feels how the likely word can be the wrong one. Then students learn a four-step fact-desk method that works on feeds and group chats too.

  They underline the checkable claims, meaning names, dates, numbers, places, and quotes. They mark those claims by risk. They lateral-read the risky ones by naming a second, independent source. Then they stamp a verdict and back it with evidence. That is media literacy practiced on the kind of text your students read every day.

  Pairs work three short AI-style passages about the Moon, world records, and famous inventions. Every error sits in checkable territory, and one is a made-up quote that sounds completely real. Partners split the last two drafts, then swap sheets to catch what the other missed. Each draft ends with a note to the writer: what's wrong, where to check it, and whether the ending still stands. On paper they name that second source. With devices, they open it.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, every transition scripted, a what-if under each.
  • The Fact Desk worksheet, 3 pages. Three AI-style passages, verdict check boxes, and an exit ticket.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. Every planted error with the true fact, a C/S grading line, a second-source key per draft, and the exit ticket key. Plus verdict guidance with an exemplar note for all three drafts and a when-it-goes-sideways panel.
  • Slide deck, 12 slides (.pptx). Teacher script and answer keys sit in the speaker notes. It opens in PowerPoint, Keynote, or Google Slides.
  • Support, Extension, ELL, and no-device variants, written into the plan.
  Works on paper or on devices. Zero prep: print it tonight, teach it tomorrow.

  Standards: CCSS ELA RI.6.8, ISTE 1.3.b, ISTE 1.3.d. The teacher guide prints a taught and assessed map for every code.

  Lesson 3 of 6 in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
