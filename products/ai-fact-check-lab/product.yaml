description: |
  AI fact-checking made concrete: your students get hired at a newsroom fact desk, and nothing runs until they clear it. This no-prep, 45-minute lesson teaches WHY AI "hallucinates" — it predicts likely words, so it can be confidently wrong — and gives students a four-step fact-desk method they'll use for life: underline the checkable claims (names, dates, numbers, places, quotes), rank them by risk, lateral-read the riskiest ones against a second independent source, then stamp a verdict: RUN, FIX, or KILL.

  The hook: you read a smooth, confident paragraph aloud, the class votes to print it — then you reveal the planted errors nobody caught. Smooth is not the same as true.

  In the main activity, students staff The Fact Desk at The Comet, a fictional school paper, and work three short AI-style draft passages with errors planted in verifiable territory (astronomy, geography, invention history). They underline claims, mark each CHECK or SAFE, name where they'd verify, and deliver a verdict with evidence — including catching a fabricated quote that sounds completely real.

  INCLUDES: scripted 45-minute lesson plan, The Fact Desk student worksheet (2 pages, 3 passages), teacher guide with a complete answer key (every planted error + the true fact), verdict guidance, exit ticket, and discussion questions. Fully unplugged by design — passages are printed — and if you DO have devices, students lateral-read the top claims live.

  Aligned to CCSS ELA RI.6.8 and ISTE Standards for Students 1.3.b and 1.3.d, with a taught/assessed map for every code in the teacher guide. Lesson 3 of 6 in the Future Skills AI Literacy unit. Zero prep: print and teach.
