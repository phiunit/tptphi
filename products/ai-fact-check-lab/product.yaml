description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  Smooth is not the same as true. AI predicts likely words, so it can be confidently wrong.

  At The Fact Desk, your students check 3 AI-helped drafts for the school paper and stamp each one RUN, FIX or KILL.

  You open by reading a smooth, confident paragraph aloud, and the class votes to print it. Then you reveal the two planted errors nobody caught. That is the whole case for fact-checking AI, made in the first 6 minutes. Students then learn a 4-step fact-desk method they will use for life.

  They underline the checkable claims, meaning names, dates, numbers, places and quotes. They rank those claims by risk. They lateral-read the risky ones by naming a second, independent source. Then they stamp a verdict and back it with evidence. That is media literacy practiced on the thing your students actually use.

  Pairs work three short AI-style passages with errors planted in verifiable territory, including a fabricated quote that sounds completely real. Astronomy, geography and invention history give the class checkable ground. Students underline claims, mark each one C for check or S for safe, and name where they would look. They finish with a note to the writer saying what is wrong, what the second source is, and whether the ending still stands. On paper they name that second source, and with devices they open it.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, every transition scripted, a what-if under each.
  • The Fact Desk worksheet, 3 pages. 3 AI-style passages, verdict check boxes and an exit ticket.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. Every planted error with the true fact, a second-source key per draft, and the exit ticket key. Plus verdict guidance with an exemplar note and a when-it-goes-sideways panel.
  • Slide deck, 12 slides (.pptx). Teacher script and answer keys sit in the speaker notes. It opens in PowerPoint, Keynote or Google Slides.
  • Support, Extension, ELL and no-device variants, written into the plan.
  Works with any AI tool or none. Zero prep: print it tonight, teach it tomorrow.

  Standards: CCSS ELA RI.6.8, ISTE 1.3.b, ISTE 1.3.d. The teacher guide prints a taught and assessed map for every code.

  Lesson 3 of six in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
