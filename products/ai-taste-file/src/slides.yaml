# Projectable deck for the lesson plan — every slide is a moment in the 45 minutes.
# Teacher script lives in the speaker notes; students see only what's on the slide.
kicker: The Editor's Chair Lesson
subtitle: "Your For-You Page didn't guess your taste — you taught it, one like at a time. Today you write your taste down on one page, then use it to make YOUR OWN writing better."
notes: "Open on this slide while students settle. Worksheet: My Taste File + The Editor's Chair, 2 pages, one per student."
slides:
  - type: hook
    minutes: 6
    title: "Warm-Up — The Algorithm Knows You"
    headline: "Raise your hand if your feed knows you a little too well."
    lines:
      - "Two people download the same app on the same day."
      - "A month later: one feed is all horror edits, the other is all cooking videos."
      - "The app didn't guess. How did it learn?"
    notes: "Take 2–3 answers. Land on: every like, skip, rewatch and follow is a signal. You taught it your taste — and the more precisely you signal, the better the feed serves you. Your feed IS your taste, written down in likes and skips."
  - type: question
    title: "Here's the flip side"
    question: "A fresh chat knows NOTHING about you. So how does it learn your taste?"
    sub: "Same way the feed did — you teach it. Today you write your taste down on one page, then use it to make YOUR OWN writing better."
    notes: "Bridge, verbatim: \"Here's the flip side: a fresh chat knows nothing about you. It knows nothing about your taste until you teach it. Today you write your taste down on one page — and then you use it to make YOUR OWN writing better.\""
  - type: cards
    minutes: 9
    title: "Generic In, Generic Out"
    items:
      - { label: 1, name: "Generic in, generic out", text: "Ask \"give me feedback on my paragraph\" and you get fortune-cookie notes: \"add detail.\" True for anyone, useful to no one." }
      - { label: 2, name: "The Taste File", text: "One page: your tone, formats, pet peeves, one \"so me\" sentence. Your For-You Page for words — now the notes fit YOU." }
      - { label: 3, name: "The editor loop", text: "YOU draft → editor gives notes → YOU revise. The human does the writing at both ends." }
    notes: "Three beats, in order. Beat 3 — say it plainly: \"AI is your editor, not your ghostwriter.\" Then advance to model the difference on the board."
  - type: compare
    title: "Model it on the board"
    left: { heading: "GENERIC NOTE", text: "\"Make it more interesting.\"" }
    right: { heading: "TASTE-FILE NOTE", text: "\"Your taste file says funny and blunt — sentence 2 sounds like a homework robot. Say it like you'd text it.\"" }
    notes: "Ask: which note could you actually act on? The right-hand note points at the writer's own taste file. That's the whole difference between a fortune cookie and an editor."
  - type: quote
    quote: "AI is your editor, not your ghostwriter."
    sub: "An editor gives notes on YOUR writing. A ghostwriter writes it for you and lets you put your name on it. Today, nobody in this room is a ghostwriter — not a partner, not an AI."
    notes: "Say it plainly and move on. The Editor's Loop Checklist on worksheet page 2 repeats it."
  - type: list
    minutes: 12
    title: "Activity 1 — Build Your Taste File"
    items:
      - "Section 1 — The Vibe: circle 3 tone words that sound like you, add one of your own."
      - "Section 2 — How I Like It Served: check every format you actually enjoy reading."
      - "Section 3 — Pet Peeves: \"Editor, never do this to my writing...\""
      - "Section 4 — So Me / Not Me: one weekend sentence in your voice, then in a voice that isn't."
      - "Section 5 — Into Right Now: the vibe of the music, shows and games you're into."
    notes: "Solo on worksheet page 1. Circulate and push for specifics: \"lowkey\" beats \"good\"; \"don't make me sound like a textbook\" beats \"be nice.\" Minute 10: two volunteers read a So Me sentence — the class hears how different real taste sounds."
  - type: steps
    minutes: 14
    title: "Activity 2 — The Editor's Chair"
    items:
      - { minutes: 5, name: "Draft it yourself", text: "Solo, worksheet page 2. 3–4 sentences: the About Me for a channel or profile page you'd actually make. No AI, no partner." }
      - { minutes: 4, name: "Editor's notes", text: "Swap drafts AND taste files. Your partner plays the AI editor: exactly 2 notes, each pointing at a numbered taste-file section. No rewriting." }
      - { minutes: 5, name: "Revise it yourself", text: "Rewrite your own draft. Star (*) every change you made. The editor never touches the draft." }
    notes: "With devices, Step 2 can run on a real AI: students paste their taste file and draft into the copy-ready prompt (Teacher Guide, p.2) and it returns 2 notes. Watch for the classic slip — partners rewriting. Redirect: \"You're the editor. Hand the pen back.\""
  - type: compare
    title: "What a good note looks like"
    left: { heading: "GHOST-NOTE (REJECT)", text: "\"Make it funnier. Say: 'Welcome to my chaotic channel!'\"" }
    right: { heading: "EDITOR'S NOTE (ACCEPT)", text: "\"Section 3 says no textbook voice — 'I enjoy various hobbies' is textbook voice. Which hobby, said your way?\"" }
    notes: "Leave this up during Editor's notes. The editor has three rules: use only the taste file, exactly 2 notes, notes not rewrites. The second the editor writes a sentence, they've become a ghostwriter."
  - type: list
    title: "Editor's Loop Checklist"
    items:
      - "I wrote the first draft myself — no AI, no copying."
      - "Each note points at a real taste-file section and is specific enough to act on — not \"make it better.\""
      - "I rewrote it myself and starred what changed."
    notes: "Bottom of worksheet page 2. Students tick all three before the exit ticket. Rows 1 and 3 are the ISTE 1.6.b check: own draft, own revision."
  - type: list
    minutes: 4
    title: "Exit Ticket"
    items:
      - "1.  One revision I made: ____"
      - "2.  It fits my taste file because: ____"
    notes: "Bottom of worksheet page 2. Collect. Score for specificity — the Teacher Guide has the Proficient / Developing / Beginning guidance."
  - type: closer
    statement: "You draft. The editor gives notes. You revise."
    sub: "When AI can write anything, the thing that's still yours is your taste. Write it down precisely and every editor — app, AI, or human — finally serves YOU."
    notes: "Close on this. Next in the unit: Lesson 5 — AI and future jobs."
