<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url('../../../brand/fonts/SpaceGrotesk-500.ttf') format('truetype'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('../../../brand/fonts/SpaceGrotesk-700.ttf') format('truetype'); }
* { box-sizing: border-box; margin: 0; }
html { overflow: hidden; height: 100%; background: #14141F; }
body { min-height: 100%; }
body { width: 850px; height: 1100px; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(ellipse at 75% 85%, #3B2F8F 0%, #232345 45%, #14141F 100%); color: #fff;
  display: flex; flex-direction: column; padding: 60px; position: relative; overflow: hidden; }
/* stars */
.star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.8; }
.star.g { background: #FFB020; }
/* content */
.brand { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #FFB020; }
.chipline { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 14px; position: relative; z-index: 2; max-width: 560px; }
.chip { font-family: 'Space Grotesk', sans-serif; border: 2px solid #FFB020; color: #FFB020; font-weight: 700; font-size: 24px; padding: 9px 24px; border-radius: 99px; white-space: nowrap; }
.chip.solid { background: #FFB020; color: #14141F; }
.kicker { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 3px; text-transform: uppercase; color: #FFFFFF; opacity: 1; margin-top: 54px; position: relative; z-index: 2; }
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 96px; font-weight: 700; line-height: 1.0; letter-spacing: -2px; margin-top: 14px; position: relative; z-index: 2; }
h1 span { color: #FFB020; }
.sub { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 40px; margin-top: 26px; line-height: 1.2; color: #FFFFFF; position: relative; z-index: 2; }
.sub em { color: #FFB020; font-style: normal; }
</style></head><body>

<!-- Art: the lesson's analogy in one object — the feed card with its like-heart (the taste you taught the app)
     beside YOUR page, where the editor's note is a margin flag ("§3") pointing at one line. Nothing is
     crossed out and no new words are written over yours: a note points, it never rewrites.
     Fully inside the frame, below the chip row. -->
<svg width="470" height="300" viewBox="0 0 470 300" style="position:absolute; right:60px; bottom:48px; z-index:1;">
  <!-- the feed card -->
  <rect x="6" y="46" width="186" height="150" rx="24" fill="#fff" opacity="0.16"/>
  <rect x="6" y="46" width="186" height="150" rx="24" fill="none" stroke="#FFB020" stroke-width="10"/>
  <rect x="34" y="84" width="92" height="16" rx="8" fill="#FFD27A"/>
  <rect x="34" y="114" width="124" height="16" rx="8" fill="#FFD27A"/>
  <!-- your page -->
  <rect x="236" y="8" width="226" height="284" rx="22" fill="#fff" opacity="0.16"/>
  <rect x="236" y="8" width="226" height="284" rx="22" fill="none" stroke="#FFB020" stroke-width="10"/>
  <rect x="300" y="58" width="124" height="14" rx="7" fill="#fff" opacity="0.55"/>
  <rect x="300" y="108" width="136" height="16" rx="8" fill="#FFD27A"/>
  <rect x="300" y="160" width="116" height="14" rx="7" fill="#fff" opacity="0.55"/>
  <rect x="300" y="208" width="130" height="14" rx="7" fill="#fff" opacity="0.55"/>
  <!-- the editor's note: a margin flag pointing at one line -->
  <path d="M 196 82 L 270 82 Q 279 82 284 89 L 300 116 L 284 143 Q 279 150 270 150 L 196 150 Q 184 150 184 138 L 184 94 Q 184 82 196 82 Z" fill="#FFB020" stroke="#14141F" stroke-width="5" stroke-linejoin="round"/>
  <text x="238" y="131" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="42" fill="#14141F">§3</text>
  <!-- the like-heart, drawn last so nothing clips it -->
  <path transform="translate(116 158) scale(3.1)" d="M 12 21 C 5 15, 1 10, 1 6 C 1 2.5, 3.5 1, 6 1 C 8.5 1, 11 3, 12 5.5 C 13 3, 15.5 1, 18 1 C 20.5 1, 23 2.5, 23 6 C 23 10, 19 15, 12 21 Z" fill="#FFB020" stroke="#14141F" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
<div class="brand">Future Skills Series</div>
