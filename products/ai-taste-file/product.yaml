description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  Your For-You Page never guessed your taste. You taught it, one like at a time.

  Your students build a taste file, draft an About Me, get exactly two notes from a partner, and revise it themselves.

  An AI editor needs the same thing you gave that feed. Without it, it's generic in, generic out. So this no-prep revision and writing feedback lesson starts with the taste file, a one-page style guide. Students check tone words and favorite formats, write two pet peeves, and pair a "so me" sentence with a "not me" one. Then they draft an About Me for a channel or profile page.

  Now the usual roles flip. Your students do the writing, and the "AI" only gives notes. Partners swap all three pages, and each one plays the AI for the other. The editor gives exactly two notes, and each note has to point at a numbered section of the taste file.

  Next, the pair talks it through for two scripted minutes. The turn order is printed on the page, so every student reads their notes out loud and asks one question. Students revise their own draft on Revise & Last Check and star every change. With a projector, you can also run one volunteer's file through a real AI on your own screen.

  The human writes at both ends. AI is your editor, not your ghostwriter, and that one sentence is a classroom AI policy worth repeating all year.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, a quoted transition at every seam, a what-if under each.
  • Student worksheet, 3 pages. My Taste File, The Editor's Chair with the talk's turn order printed, and the Revise & Last Check exit ticket.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. One student's work from taste file to exit answers, plus a key or exemplar for every student item. Also AI-editor coaching, a when-it-goes-sideways list, and a copy-ready AI feedback prompt.
  • Slide deck, 13 slides (.pptx). Teacher script and answer keys sit in the speaker notes. It opens in PowerPoint, Keynote, or Google Slides.
  • Support, Extension, ELL, and no-device variants, written into the plan.
  Works with any AI tool or none, because the partner IS the AI. Zero prep. Print it tonight, teach it tomorrow.

  Standards: CCSS ELA W.6.5, ISTE 1.1.c, CCSS ELA SL.6.1.

  Lesson 4 of 6 in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
