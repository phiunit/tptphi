description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  Your For-You Page never guessed your taste. You taught it, one like at a time.

  Your students build a Taste File, draft an About Me, take exactly two notes on it, and revise it themselves.

  An AI editor needs the same thing you gave that feed. Without it you get generic in, generic out. So this no-prep revision and writing feedback lesson starts with the Taste File, a 1-page style guide. Students fill in tone words, favorite formats, pet peeves, and a "so me" versus "not me" writing sample. Then they draft an About Me for a channel or profile page.

  Now the loop runs the right way around. Each student hands the taste file to an editor, either a partner playing the AI or your projected AI tool. The editor gives exactly two notes, and each note has to point at a numbered section. They talk it through in a scripted 1-minute exchange. Students then revise their own draft in The Editor's Chair and star every change.

  The human writes at both ends. AI is your editor, not your ghostwriter, and that one sentence is the classroom AI policy your students will actually remember.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, a quoted transition at every seam, a what-if under each.
  • Student worksheet, 3 pages. My Taste File, The Editor's Chair, and the Revise & Last Check exit ticket.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. One worked example from taste file to exit answers, plus a key or exemplar for every student item. Also AI-editor coaching, a when-it-goes-sideways list, and a copy-ready AI feedback prompt.
  • Slide deck, 13 slides (.pptx). Teacher script and answer keys sit in the speaker notes. It opens in PowerPoint, Keynote or Google Slides.
  • Support, Extension, ELL and no-device variants, written into the plan.
  Works with any AI tool or none, because the partner IS the AI. Zero prep: print it tonight, teach it tomorrow.

  Standards: CCSS ELA W.6.5, ISTE 1.6.b, CCSS ELA SL.6.1. The scripted partner talk covers SL.6.1. Notes read aloud, one question, and an answer from the taste file make a one-on-one collaborative discussion.

  Lesson 4 of six in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
