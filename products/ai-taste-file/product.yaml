description: |
  NO STUDENT AI ACCOUNTS NEEDED — this lesson runs fully on paper. Your For-You Page didn't guess your taste — you taught it, one like at a time — so in My Taste File + The Editor's Chair, students write a one-page style guide, draft an About Me, take exactly two notes, and revise it themselves. An AI editor needs the same thing: you telling it. Otherwise it's generic in, generic out.

  AI as editor, not ghostwriter: a no-prep, 45-minute revision and feedback lesson. The Taste File is a personal style guide — tone words, favorite formats, pet peeves, a "so me" vs. "not me" writing sample. Then the loop runs the right way around: students draft an About Me for a channel or profile page, hand their taste file to their editor (a partner playing the AI, or the teacher's projected AI tool) for exactly two notes that each point at a numbered section, talk it through in a scripted 1-minute exchange, and revise their own draft, starring every change. The human does the writing at both ends. That one habit is the classroom AI policy your students will actually remember.

  INCLUDES: a scripted lesson plan (2 pages — every block timed, a quoted transition at every seam, a what-if under every block); the 3-page student worksheet (My Taste File, The Editor's Chair, Revise & Last Check exit ticket) plus a typeable (fillable) PDF copy for Chromebooks and tablets; a teacher guide (3 pages) with a key or exemplar for every student item including the exit ticket, one worked example from taste file to exit answers, coaching for the "AI editor" role, a when-it-goes-sideways list and a copy-ready AI feedback prompt; a projectable slide deck (.pptx, 13 slides, teacher script and answer keys in the speaker notes; opens in PowerPoint, Keynote or Google Slides); and Support, Extension, ELL and no-device variants built in. Works with any AI tool or none: the partner IS the AI. Print and teach the same morning.

  Standards: CCSS ELA W.6.5 (revising and strengthening writing with peer support), ISTE 1.6.b (creating original work), and CCSS ELA SL.6.1 (the scripted partner talk — notes read aloud, one question, an answer from the taste file — is a one-on-one collaborative discussion).

  Lesson 4 of 6 in the AI Literacy unit — stands alone; the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
