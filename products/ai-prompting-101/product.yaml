description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  AI is a literal genie. It grants what you SAID, not what you MEANT.

  Your students repair three cursed prompts in the Cursed Wish Repair Shop, then swap sheets and break each other's.

  The 45 minutes open with you as the Worst Genie Ever, cheerfully ruining every vague wish. Students then learn the P.R.O. framework, the three parts of a genie-proof prompt: Purpose, Requirements, Output. In the Repair Shop they fix Amara's, Mateo's and Yuki's broken prompts. Then they read a partner's repairs like a literal genie and try to break them. That adversarial move is the real skill behind prompt writing.

  The exit ticket hands them a confident-sounding sample AI answer with one false claim. They spot the checkable claims and name where they would check each one. It is AI literacy for middle school, taught as a writing skill.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, every transition scripted, a what-if under each.
  • Cursed Wish Repair Shop worksheet, 2 pages with exit ticket. Real write-in space on every part.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. A key or exemplar for every student item, Worst-Genie improv tips, an AI-honesty discussion guide, and a when-it-goes-sideways list.
  • Slide deck, 11 slides (.pptx). Teacher script and answer keys sit in the speaker notes. It opens in PowerPoint, Keynote or Google Slides.
  • Support, Extension, ELL and no-device variants, written into the plan.
  Works with any AI tool or none. Where devices are allowed, the plan says exactly what ChatGPT, Claude or Gemini add. Zero prep: print it tonight, teach it tomorrow.

  Standards: ISTE 1.5.c, ISTE 1.3.b, CCSS ELA W.6.4.

  Lesson 1 of six in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Lessons 2 to 6: What's in the Playlist?, Hallucination Hunters, Teach AI Your Taste, Robots Do the Boring Work, Lead Your AI Squad. Search the store for "AI Literacy Unit Bundle".
