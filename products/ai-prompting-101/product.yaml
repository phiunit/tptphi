description: |
  NO STUDENT AI ACCOUNTS NEEDED — this lesson runs fully on paper. The hook: AI is a literal genie that grants what you SAID, not what you MEANT — so in the Cursed Wish Repair Shop, students rewrite three kids' cursed prompts, then swap sheets and play the Worst Genie Ever to twist each other's.

  The 45-minute lesson opens with you, the Worst Genie Ever, cheerfully ruining vague wishes. Students then learn the P.R.O. framework (Purpose, Requirements, Output): the three parts of a genie-proof prompt. In the Cursed Wish Repair Shop they repair Amara's, Mateo's and Yuki's broken prompts, then try to BREAK a partner's repairs by reading them like a literal genie — the adversarial thinking that is the real skill behind prompt writing. The exit ticket asks them to find the one checkable claim in a confident-sounding sample AI answer and name where they would check it.

  INCLUDES: the lesson plan (2 pages: every block timed to 45 minutes, every transition written, a what-if under every block); the Cursed Wish Repair Shop worksheet (2 pages, with exit ticket) plus a fillable PDF copy for Chromebooks and tablets; a teacher guide (3 pages) with a key or exemplar for every student item, Worst-Genie improv tips, a "when it goes sideways" list and an AI-honesty discussion guide; a slide deck (.pptx, 11 slides, opens in PowerPoint, Keynote or Google Slides) with the teacher script and answer keys in the speaker notes; and Support / Extension / ELL / no-device variants. Works with any AI tool (ChatGPT, Claude, Gemini) or none: where devices are available, the plan says exactly what they add. Zero prep: print and teach the same morning.

  Standards: ISTE 1.5.c, ISTE 1.3.b, CCSS ELA W.6.4.

  Lesson 1 of 6 in the AI Literacy unit — stands alone; the 6-lesson bundle saves 30%. Lessons 2–6: What's in the Playlist, Hallucination Hunters, Teach AI Your Taste, Robots Do the Boring Work, and Lead Your AI Squad.
