description: |
  Your students already use AI. This no-prep, 45-minute lesson teaches them to use it WELL — and to think critically about what comes back.

  The hook: AI is a literal genie. It grants exactly what your words ask for — not what your brain meant. The lesson opens with "The Worst Genie Ever" (you, cheerfully ruining vague wishes), then teaches the P.R.O. framework (Purpose, Requirements, Output) — the three clauses of a genie-proof wish. In the Cursed Wish Repair Shop, students rewrite broken prompts, then try to BREAK each other's prompts by misreading them like a literal genie — adversarial thinking that's the real skill behind prompt writing.

  INCLUDES: full scripted lesson plan (45 min), Cursed Wish Repair Shop student worksheet, teacher answer guide with sample strong prompts and Worst-Genie improv tips, exit ticket, and discussion prompts on AI accuracy and academic honesty. Works with ANY AI tool (ChatGPT, Claude, Gemini) — or completely unplugged with no devices at all.

  Aligned to ISTE Standards for Students and CCSS ELA W.6.4. Zero prep: print and teach.
