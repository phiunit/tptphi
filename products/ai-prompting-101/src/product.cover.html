<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url('../../../brand/fonts/SpaceGrotesk-500.ttf') format('truetype'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('../../../brand/fonts/SpaceGrotesk-700.ttf') format('truetype'); }
* { box-sizing: border-box; margin: 0; }
html { overflow: hidden; height: 100%; background: #14141F; }
body { min-height: 100%; }
body { width: 850px; height: 1100px; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(ellipse at 75% 85%, #3B2F8F 0%, #232345 45%, #14141F 100%); color: #fff;
  display: flex; flex-direction: column; padding: 60px; position: relative; overflow: hidden; }
/* stars */
.star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.8; }
.star.g { background: #FFB020; }
/* content */
.brand { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #FFB020; }
.chipline { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 14px; position: relative; z-index: 2; max-width: 560px; }
.chip { font-family: 'Space Grotesk', sans-serif; border: 2px solid #FFB020; color: #FFB020; font-weight: 700; font-size: 24px; padding: 9px 24px; border-radius: 99px; white-space: nowrap; }
.chip.solid { background: #FFB020; color: #14141F; }
.kicker { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: #E8E8F5; opacity: 0.85; margin-top: 70px; position: relative; z-index: 2; }
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 96px; font-weight: 700; line-height: 1.0; letter-spacing: -2px; margin-top: 14px; position: relative; z-index: 2; }
h1 span { color: #FFB020; }
.sub { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 40px; margin-top: 26px; line-height: 1.15; color: #FFFFFF; position: relative; z-index: 2; max-width: 730px; }
.free { position: absolute; top: 46px; right: 46px; background: #FFB020; color: #14141F; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
  font-size: 30px; padding: 18px 26px; border-radius: 20px; transform: rotate(6deg); z-index: 3; }
</style></head><body>
<div class="star g" style="width:10px;height:10px;left:690px;top:230px"></div>
<div class="star" style="width:4px;height:4px;left:560px;top:140px"></div>
<div class="star g" style="width:8px;height:8px;left:790px;top:400px"></div>
<div class="star" style="width:5px;height:5px;left:760px;top:560px"></div>
<div class="star g" style="width:6px;height:6px;left:560px;top:980px"></div>
<!-- Art: the whole lamp with one light wisp of smoke, fully inside the frame (bottom-right) -->
<svg width="350" height="376" viewBox="60 190 400 430" style="position:absolute; right:48px; bottom:42px; z-index:1;">
  <defs>
    <linearGradient id="wisp" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#FFC957"/>
      <stop offset="0.55" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FFE4AE"/>
    </linearGradient>
  </defs>
  <!-- smoke: one continuous wisp rising from the spout, ending in a curl -->
  <path d="M 150 470
           C 120 420, 205 400, 215 340
           C 224 290, 160 280, 178 240
           C 190 212, 236 214, 234 246
           C 232 268, 200 268, 204 250"
        fill="none" stroke="url(#wisp)" stroke-width="22" stroke-linecap="round"/>
  <!-- lamp -->
  <g fill="#FFB020">
    <path d="M 130 540 Q 250 480 372 540 Q 340 610 251 610 Q 162 610 130 540 Z"/>
    <path d="M 152 528 Q 110 500 88 462 Q 118 452 148 470 Q 170 486 190 512 Z"/>
    <path d="M 214 512 Q 251 496 288 512 L 278 528 Q 251 518 224 528 Z"/>
    <circle cx="251" cy="492" r="12"/>
    <path d="M 372 540 Q 430 512 420 468 Q 414 440 386 444" fill="none" stroke="#FFB020" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
<div class="free">FREE</div>
<div class="brand">Future Skills Series</div>
<div class="chipline" style="margin-top:14px"><span class="chip">AI Literacy · Lesson 1 of 6</span></div>
<div class="kicker">The Literal Genie Lesson</div>
<h1>How to Talk<br><span>to AI</span></h1>
<p class="sub">AI grants what you SAID,<br>not what you MEANT.</p>

</body></html>
