description: |
  NO STUDENT AI ACCOUNTS NEEDED — this lesson runs fully on paper. "Will AI take all the jobs?" Your students are already asking, so The Studio Task Board hands them the decision: pairs run Big Dream Studio, a small recording studio with too much to do, and sort twelve real studio tasks into what the new AI assistant does, what it helps with, and what it never touches.

  The honest 45-minute frame, hedged the way a middle schooler deserves: AI takes over tasks, not whole jobs — nobody can promise the final count — and every automation choice has a winner, a loser and a way it could go wrong. Students sort tasks like booking reminder texts, a rough first mix, coaching a nervous first-time singer and agreeing on a price into three columns: AUTOMATE (boring and repeating — hand it to AI), AUGMENT (the human decides, AI helps) and KEEP HUMAN (coaching, taste, being there for someone). Then they write the trade behind two of their choices (who wins, who loses something, what could go wrong), defend one out loud with a claim frame while the listening pair scores eyes, voice and pace, and finish with an exit ticket that runs the same three columns on a job someone in their life really has.

  Standards: CSTA 2-IC-20, CCSS ELA SL.6.4, ISTE 1.3.d.

  INCLUDES: the lesson plan (2 pages: every block timed to 45 minutes, every transition written, a what-if under every block); The Studio Task Board worksheet (2 pages, with exit ticket) plus a fillable PDF copy for Chromebooks and tablets; a teacher guide (3 pages) with a key or exemplar for every student item — the sort key for all twelve tasks, a worked trade card, a worked claim, the listener-strip key, the Defense Rubric, an exit-ticket exemplar — plus discussion moves and a "when it goes sideways" list; a slide deck (.pptx, 12 slides, opens in PowerPoint, Keynote or Google Slides) with the teacher script and keys in the speaker notes; and Support / Extension / ELL / no-device variants. Zero prep: print and teach the same morning.

  Lesson 5 of 6 in the AI Literacy unit — stands alone; the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
