description: |
  NO STUDENT AI ACCOUNTS NEEDED. Every lesson in this unit runs fully unplugged — on paper, with partners — so it works in districts that restrict student AI use or devices, and in any classroom without reliable tech. Where devices are available, each plan says exactly what they add.
  "Will AI take all the jobs?" Your students are already asking. This no-prep, 45-minute lesson gives them an answer they can actually use: AI changes jobs more than it deletes them — and every automation choice has a winner, a loser, and a maybe.

  The hook: students run Big Dream Studio, a small recording studio with too much to do. On The Studio Task Board, pairs sort 12 real studio tasks — booking reminder texts, mixing a demo, coaching a nervous first-time artist, negotiating a fee — into three columns: AUTOMATE (boring and repeating — hand it to AI), AUGMENT (the human decides, AI assists), and KEEP HUMAN (mentorship, taste, live connection). Then they write the tradeoff behind two of their calls (who wins, who loses, what could go wrong) and defend one choice out loud. Exit ticket: run the same three columns on a job someone in their life actually has.

  INCLUDES: full scripted lesson plan (45 min), Studio Task Board student worksheet (2 pages), teacher guide with suggested sorts and the honest note on grading them, discussion moves for the hard questions, a share-out rubric, exit ticket exemplar, and full standards text. Completely unplugged — no devices needed at any point.

  Aligned to CSTA 2-IC-20 (comparing tradeoffs of computing technologies), CCSS ELA SL.6.4, and ISTE Standards for Students 1.3.d. Zero prep: print and teach the same morning.
