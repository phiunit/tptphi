description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  Your students are already asking whether AI will take all the jobs. This lesson answers honestly.

  Pairs run Big Dream Studio, sorting 12 studio tasks into what AI does, what it helps with, and what it never touches.

  The honest frame comes first, hedged the way a middle schooler deserves. AI takes over tasks, not whole jobs, and nobody can promise the final count. Every automation choice has a winner, a loser and a way it could go wrong. That frame turns a scary headline about future jobs into a thinking problem.

  Big Dream Studio is a small recording studio with too much to do. On The Studio Task Board, pairs sort tasks like booking reminder texts and a rough first mix. Others are harder, like coaching a nervous first-time singer or agreeing on a price. They sort into three columns. AUTOMATE is boring and repeating, so hand it to AI. AUGMENT means the human decides and AI helps. KEEP HUMAN covers coaching, taste, and being there for someone.

  Students then write the trade behind 2 of their choices, naming who wins, who loses something, and what could go wrong. They defend one out loud with a claim frame while the listening pair scores eyes, voice and pace. The exit ticket runs the same three columns on a job someone in their life really has. It is career exploration that starts from tasks, not job titles.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, every transition scripted, a what-if under each.
  • The Studio Task Board worksheet, 2 pages with exit ticket. Real write-in space on every part.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. The sort key for all 12 tasks, a worked trade card, a worked claim, and the listener-strip key. Plus the Defense Rubric, an exit-ticket exemplar, discussion moves, and a when-it-goes-sideways list.
  • Slide deck, 12 slides (.pptx). Teacher script and keys sit in the speaker notes. It opens in PowerPoint, Keynote or Google Slides.
  • Support, Extension, ELL and no-device variants, written into the plan.
  Zero prep: print it tonight, teach it tomorrow.

  Standards: CSTA 2-IC-20, CCSS ELA SL.6.4, ISTE 1.3.d.

  Lesson 5 of six in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
