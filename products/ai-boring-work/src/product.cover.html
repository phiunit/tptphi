<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url('../../../brand/fonts/SpaceGrotesk-500.ttf') format('truetype'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('../../../brand/fonts/SpaceGrotesk-700.ttf') format('truetype'); }
* { box-sizing: border-box; margin: 0; }
html { overflow: hidden; height: 100%; background: #14141F; }
body { min-height: 100%; }
body { width: 850px; height: 1100px; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(ellipse at 75% 85%, #3B2F8F 0%, #232345 45%, #14141F 100%); color: #fff;
  display: flex; flex-direction: column; padding: 60px; position: relative; overflow: hidden; }
/* stars */
.star { position: absolute; background: #fff; border-radius: 50%; opacity: 0.8; }
.star.g { background: #FFB020; }
/* content */
.brand { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #FFB020; }
.chipline { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 14px; position: relative; z-index: 2; max-width: 560px; }
.chip { font-family: 'Space Grotesk', sans-serif; border: 2px solid #FFB020; color: #FFB020; font-weight: 700; font-size: 24px; padding: 9px 24px; border-radius: 99px; white-space: nowrap; }
.chip.solid { background: #FFB020; color: #14141F; }
.kicker { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: #E8E8F5; opacity: 0.85; margin-top: 70px; position: relative; z-index: 2; }
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 96px; font-weight: 700; line-height: 1.0; letter-spacing: -2px; margin-top: 14px; position: relative; z-index: 2; }
h1 span { color: #FFB020; }
.sub { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 40px; margin-top: 26px; line-height: 1.15; color: #FFFFFF; position: relative; z-index: 2; max-width: 730px; white-space: nowrap; }
</style></head><body>
<div class="star g" style="width:10px;height:10px;left:700px;top:180px"></div>
<div class="star" style="width:4px;height:4px;left:520px;top:120px"></div>
<div class="star g" style="width:8px;height:8px;left:800px;top:330px"></div>
<div class="star g" style="width:6px;height:6px;left:790px;top:420px"></div>
<div class="star" style="width:4px;height:4px;left:200px;top:900px"></div>
<!-- Art: the Task Board — three columns of letter tiles. The robot's arms span the first two columns (automate / augment);
     a hand holds a mic over the third (keep human). Solid fills only: gold columns, dark tiles, light-gold robot, white hand. -->
<svg width="560" height="340" viewBox="0 0 560 340" style="position:absolute; right:60px; bottom:60px; z-index:1;" font-family="'Space Grotesk', Arial, sans-serif">
  <!-- robot, centered over columns 1–2; its arms rest on both column tops -->
  <g fill="#FFD27A">
    <rect x="173" y="0" width="8" height="14" rx="4"/>
    <rect x="112" y="12" width="130" height="82" rx="22"/>
    <rect x="96" y="40" width="16" height="28" rx="6"/><rect x="242" y="40" width="16" height="28" rx="6"/>
    <rect x="164" y="92" width="26" height="12"/>
    <rect x="14" y="102" width="326" height="20" rx="10"/>
    <rect x="14" y="102" width="20" height="26" rx="8"/><rect x="320" y="102" width="20" height="26" rx="8"/>
  </g>
  <circle cx="177" cy="4" r="8" fill="#FFB020"/>
  <g fill="#14141F">
    <circle cx="152" cy="48" r="11"/><circle cx="202" cy="48" r="11"/>
    <rect x="158" y="72" width="38" height="8" rx="4"/>
  </g>
  <!-- hand over column 3, gripping a studio mic (keep human = the singing, the coaching) -->
  <g transform="rotate(-14 476 96)">
    <rect x="452" y="100" width="48" height="60" fill="#FFFFFF"/>
    <rect x="464" y="44" width="24" height="84" rx="8" fill="#FFB020"/>
    <rect x="438" y="-4" width="76" height="66" rx="34" fill="#FFD27A"/>
    <g stroke="#14141F" stroke-width="4" stroke-linecap="round">
      <line x1="446" y1="16" x2="506" y2="16"/><line x1="442" y1="34" x2="510" y2="34"/><line x1="448" y1="50" x2="504" y2="50"/>
      <line x1="463" y1="2" x2="463" y2="56"/><line x1="489" y1="2" x2="489" y2="56"/>
    </g>
    <rect x="436" y="70" width="80" height="44" rx="15" fill="#FFFFFF"/>
    <g stroke="#14141F" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="460" y1="74" x2="460" y2="88"/><line x1="478" y1="74" x2="478" y2="88"/><line x1="496" y1="74" x2="496" y2="88"/>
    </g>
    <rect x="430" y="90" width="58" height="20" rx="10" fill="#FFFFFF" stroke="#14141F" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <!-- three solid columns -->
  <g fill="#FFB020">
    <rect x="0" y="128" width="170" height="212" rx="18"/>
    <rect x="195" y="128" width="170" height="212" rx="18"/>
    <rect x="390" y="128" width="170" height="212" rx="18"/>
  </g>
  <!-- one tile per column, reading the sort itself: AI · AI + YOU · YOU -->
  <g fill="#14141F">
    <rect x="16" y="202" width="138" height="64" rx="12"/>
    <rect x="199" y="202" width="162" height="64" rx="12"/>
    <rect x="406" y="202" width="138" height="64" rx="12"/>
  </g>
  <g fill="#FFB020" font-weight="700" font-size="32" text-anchor="middle">
    <text x="85" y="245">AI</text><text x="280" y="245">AI + YOU</text><text x="475" y="245">YOU</text>
  </g>
</svg>
<div class="brand">Future Skills Series</div>
<div class="chipline" style="margin-top:14px"><span class="chip">AI Literacy · Lesson 5 of 6</span></div>
<div class="kicker">The Task Board Lesson</div>
<h1>Robots Do the<br><span>Boring Work</span></h1>
<p class="sub">AI takes <em style="color:#FFB020;font-style:normal">tasks</em> first, not whole jobs.</p>
<div class="chipline"><span class="chip solid">Grades 6–8</span><span class="chip">45-min lesson</span><span class="chip">No prep · No devices needed</span></div>
</body></html>
