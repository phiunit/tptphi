description: |
  NO STUDENT AI ACCOUNTS NEEDED. This frame runs on paper.

  Any story. Check it before you repeat it.

  Your students run one news story through the Fact Desk frame. They underline the claims, name a second source, and stamp it RUN, FIX or KILL.

  This is a free one-page news literacy template for middle school. It is undated and number-free, so it works with any story you bring, this week or next year. Students write in the story, where they saw it, and the date. Then the method takes over. They underline every claim they could check. They rank each one C (check it) or S (safe). For every C they name a second source, and a second source is never where they first saw it. Then they stamp a verdict and give their evidence. The frame ends with a two-line "So what?" about why the story matters to someone their age.

  It runs in 45 minutes as News Desk Day (Open 5, Read 10, Frame 20, Share-out 10) or in 25 as a bell-ringer. The one-page teacher guide gives you the routine, the rules for picking a classroom-safe story, a script with three quotable lines, a strong-answer example, and the rubric. Lateral reading, the move professional fact checkers use, is the skill. No device is needed. With devices, students open their second source live.

  WHAT YOU GET
  • Fact Desk frame, 1 page. Story slot, the four-step method, a claims-and-sources table, the RUN / FIX / KILL verdict, real write-in space.
  • Fillable frame PDF. Students type into the same page on Chromebooks and tablets.
  • Teacher guide, 1 page. The 45- and 25-minute routine, safe-story rules, the Fact Desk script, a strong-answer example, and the rubric.
  Zero prep: print it tonight, teach it tomorrow.

  Standards: ISTE 1.3.b, CCSS ELA RI.6.8, CCSS ELA W.6.1. The teacher guide prints the full text of each, with what teaches it and what assesses it.

  This is Frame 1 of 10 from the News Desk pack: ten one-page frames that run any story (who wins and who loses, write the rule, who pays for free, unit rate, percent change and more), with a lesson plan, a 4-page teacher guide, worked examples and a slide deck. Search the store for "News Desk Frames". The Fact Desk method comes from Lesson 3 of the AI Literacy unit, Hallucination Hunters, where students hunt planted errors in AI-written drafts. Search "Hallucination Hunters" for the full lesson.
