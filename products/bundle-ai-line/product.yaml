description: |
  NO STUDENT AI ACCOUNTS NEEDED. All six 45-minute lessons run on paper.

  Your students already use AI. This unit teaches them to use it well, question what comes back, and see how it works underneath.

  Six AI literacy lessons, ready to teach the morning you buy them. Run one a day for six class periods, or one a week for six weeks. The unit works in districts that restrict student AI use or student devices. Where devices are allowed, each plan says exactly what they add.

  THE ARC
  Lesson 1. How to Talk to AI. Students write prompts that can't be twisted.
  Lesson 2. What's in the Playlist? They discover how AI learns and where bias comes from.
  Lesson 3. Hallucination Hunters. They fact-check AI output like a newsroom.
  Lesson 4. Teach AI Your Taste. They teach AI their own voice, then revise their own writing.
  Lesson 5. Robots Do the Boring Work. They argue the tradeoffs of automation and future jobs.
  Lesson 6. Lead Your AI Squad. They run a team of AI helpers in a capstone that reuses every skill.

  WHAT YOU GET, FOR ALL SIX LESSONS
  • Lesson plan, 2 pages. Every block timed to 45 minutes, every transition scripted.
  • Student worksheet, 2 to 3 pages. Real write-in space and an exit ticket on every one.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. An answer key or exemplar for every student item.
  • Slide deck, 11 to 13 slides (.pptx). Teacher script and keys sit in the speaker notes.
  • Support, Extension, ELL and fully unplugged variants, written into every plan.
  • Unit Overview and Pacing Guide, 2 pages.
  That is 31 files in the download. Zero prep: print it tonight, teach it tomorrow.

  THE THROUGH-LINE
  Every AI job runs human to AI to human. A person starts it with the prompt. A person ends it with the check. That transfers to every AI tool your students will ever touch. And the honesty policy is one sentence they remember: AI is your editor, not your ghostwriter.

  Standards: ISTE 1.5.c, ISTE 1.3.b, CSTA 2-IC-20, CSTA 2-IC-21, CCSS ELA W.6.4, W.6.5, RI.6.8, SL.6.1, SL.6.4. Every teacher guide prints where its standards are taught and where they are assessed, so the unit survives an admin review.

  $14 buys all six middle school AI lessons. The five paid lessons cost $20 on their own, so you save 30%. Lesson 1 is free on its own if you want to try the unit first.
