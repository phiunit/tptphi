description: |
  NO STUDENT AI ACCOUNTS NEEDED — this lesson runs fully on paper. The hook: an AI is a music app and its training data is the playlist — it can only mix what's in the playlist — so in Playlist Check your students BECOME a recommendation AI with a 12-song, one-genre playlist, serve six classmates' requests, and find out exactly who a lopsided playlist fails.

  You open as AutoMix, the one-playlist music app: ask it for study music, a slow last-dance song, or a song in Spanish for grandma's birthday, and it serves a loud party track every time, with total confidence. Is the app broken — or is its playlist? That question is how students discover where AI bias actually comes from. Direct instruction breaks "how does AI learn?" into INPUT (the playlist) → PATTERNS (the training) → OUTPUT (the prediction): pattern prediction from examples, not magic. In Playlist Check, pairs work the request line, tick a Fit box for every serve, write a Playlist Gap Report (who it serves well, who it leaves out), practice repeat-then-add discussion, and Fix the Playlist by inventing the missing cards — discovering for themselves that AI bias usually comes from gaps in the data, not a villain in the code. The debrief maps their playlist gaps to real AI examples (voice assistants and accents, photo tools and skin tone, one-genre recommendation feeds), and the exit ticket asks them to diagnose a brand-new lopsided AI using the word "playlist."

  Standards: CSTA 2-IC-21, ISTE 1.1.d, CCSS ELA SL.6.1.

  INCLUDES: a scripted 45-minute lesson plan (2 pages: every block timed, every transition written, a what-if for every activity); the 2-page Playlist Check worksheet (12 playlist cards built in, request table with tick boxes, gap report, Fix the Playlist, 3-item exit ticket) plus a typeable (fillable) PDF copy for Chromebooks and tablets; a teacher guide with a key or exemplar for every student item including the exit ticket, AutoMix improv tips, the real-world debrief guide and a when-it-goes-sideways list (3 pages); a projectable slide deck (.pptx, 12 slides, opens in PowerPoint, Keynote or Google Slides) with the teacher script and answer keys in the speaker notes; and Support, Extension, ELL and no-device variants written into the plan. Fully unplugged: no student devices needed; a projector for the deck is optional. Zero prep: print and teach the same morning.

  Lesson 2 of 6 in the AI Literacy unit — stands alone; the 6-lesson bundle saves 30%.
