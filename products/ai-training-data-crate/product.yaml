description: |
  How does AI actually learn — and where does AI bias come from? This no-prep, 45-minute lesson answers both with one analogy your students will never forget: a playlist. An AI can only mix what's in its playlist. Training data IS the playlist — and a playlist with only one genre serves some requests great and fails everyone else.

  The hook: you play The One-Playlist App, a recommendation AI whose playlist holds nothing but loud, fast party tracks. Study music? Party track. A song in Spanish for a grandmother's birthday? Party track. Then the real question: is the app broken — or is the playlist?

  Direct instruction breaks AI learning into INPUT (the playlist) → PATTERNS (training) → OUTPUT (prediction). No magic, no understanding — pattern prediction from data. In the main activity, Playlist Check, student pairs BECOME a recommendation AI limited to a printed playlist of 12 song cards, serve six classmates' requests, log who the playlist fails, then "doctor the playlist" to fix it — discovering for themselves that AI bias usually comes from gaps in the data, not a villain in the code. Debrief maps their playlist gaps to real AI examples (voice assistants and accents, photo tools and skin tones, one-track recommendation feeds).

  INCLUDES: full scripted lesson plan (45 min), Playlist Check student worksheet (2 pages, playlist cards built in), teacher guide with answer key, AutoMix improv tips, real-world debrief guide and exit ticket exemplars. Lesson 2 of the Future Skills AI Literacy unit — works completely standalone. Fully unplugged: no devices needed at all.

  Aligned to CSTA 2-IC-21, ISTE Standards for Students 1.1.d, and CCSS ELA SL.6.1. Zero prep: print and teach.
