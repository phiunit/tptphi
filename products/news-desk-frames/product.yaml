description: |
  NO STUDENT AI ACCOUNTS NEEDED. Every frame runs on paper.

  Any story. Ten ways to think it through.

  Your students pick one of 10 one-page frames and run any news story through it, on paper, in one class period.

  This is a news literacy pack you never have to rebuild. The frames are undated and number-free. The student writes in the story, where they saw it, and the date. Then the method takes over. Fact Desk sends every claim to a second source and stamps it RUN, FIX or KILL. The Trade asks who wins, who loses, and what could go wrong. Write the Rule turns an argument into a 3-rule policy the student has to defend. Who Pays for Free? follows the money behind a free app or site. Source Check asks who made a claim and what they gain if you believe it.

  Two frames bring the math. Unit Rate Receipt compares three plans by cost per unit. Percent Change Card turns a price hike into a percent, then into hours of work and an 8-week save-up plan. Copy, Style, or Person? sorts what an AI copied. Permission Slip decides what an AI helper may do on its own. Risk Grid rates what would hurt most to lose, then spends a fixed budget on two protections.

  News Desk Day is the 45-minute routine that runs any frame: Open 5, Read 10, Frame 20, Share-out 10. The plan also gives you the 25-minute bell-ringer version. A 10-row table matches story types to frames, so picking one takes a minute. The teacher guide tells you how to pick a classroom-safe story and gives you a script and a strong-answer example for every frame. One rubric scores any frame. Four worked examples, labeled with their month and attributed to the outlets that reported them, show a finished frame. They refresh with product updates, so the pack never goes out of date.

  WHAT YOU GET
  • News Desk frames, 10 one-page student frames. Every write-in space fits real handwriting; every frame ends with a two-line "So what?"
  • Fillable frames PDF. Students type into the same 10 pages on Chromebooks and tablets.
  • Lesson plan, 2 pages. News Desk Day timed to 45 minutes with every transition scripted, a what-if under each block, the 25-minute bell-ringer variant, and the story-to-frame table.
  • Teacher guide, 4 pages. Safe-story rules, a script and a strong-answer example for every frame, one rubric that scores any frame, and a when-it-goes-sideways panel.
  • Worked Examples, 4 pages, teacher-facing. Four dated examples from September 2026, one story per page, the frame filled in as a strong student would, and why that frame.
  • Slide deck, 12 slides (.pptx). One slide per frame, teacher script in the speaker notes. It opens in PowerPoint, Keynote or Google Slides.
  • Support, Extension, ELL and no-device variants, written into the plan.
  Works with any story you bring and any AI tool or none. Zero prep: print it tonight, teach it tomorrow.

  Standards: ISTE 1.3.b, CCSS ELA RI.6.8, CCSS ELA W.6.1, CSTA 2-IC-20, CCSS Math 6.RP.A.3c. The teacher guide prints a taught and assessed map for every code.

  Frame 1 is the Fact Desk method from Lesson 3 of the AI Literacy unit, Hallucination Hunters, ready for any story. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle". Want to try one frame first? Search "Fact Check Any News Story" for the free Fact Desk frame.
