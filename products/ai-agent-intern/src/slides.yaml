# Projectable deck for the lesson plan — every slide is a moment in the 45 minutes.
# Teacher script lives in the speaker notes; students see only what's on the slide.
# Minute chips: 6 + 9 + 24 + 6 = 45 (match the lesson plan block for block).
kicker: The Party Leader Lesson
subtitle: "An AI agent does a whole job, step by step, on its own — and if your card leaves something out, the agent usually fills the gap with a guess and keeps going."
notes: "Open on this slide while students settle. Worksheet: Run the Quest, one per student (3 pages; don't staple page 1, because the card-holder's page 1 becomes the team's quest card), plus one sheet of scrap paper per student for squad outputs. Plan teams of 3 (30 students = 10 teams; remainder rule is in the Activity notes). Fully unplugged by design. Deck follows the lesson plan block for block; minute chips top-right match it."
slides:
  - type: hook
    minutes: 6
    title: "Warm-Up — It Did EXACTLY What You Said"
    headline: "My new party member: maxed-out stats, never sleeps, never complains — painfully literal."
    lines:
      - "\"Guard the door.\"  →  Guarded the door. Only the door. The enemies used the window."
      - "\"Grab everything in the chest.\"  →  Everything. Including the cursed amulet with the obvious skull on it."
      - "\"Buy potions.\"  →  How many? It guessed ALL. Spent 900 gold, then sold your sword."
    notes: "Tell the class about last night's run and read the three orders with a straight face. The potions one is today's lesson in a single line: nobody said how many, so it guessed and kept going. (If your class did the genie lesson, someone will call it: this party member IS the literal genie — it just joined your squad. New classes need no backstory.) WHAT IF nobody laughs: ask for a fourth order from the room and ruin it the same way — \"Heal me\" → healed you. Once. Then advance to the question."
  - type: question
    title: "Whose fault was that?"
    question: "The party member's — or the orders?"
    notes: "Take two or three answers. Bridge: \"A chatbot answers a question. An AI agent does a whole job, step by step, on its own — and if your card leaves something out, the agent usually fills the gap with a guess and keeps going. Like the potions. Some agents stop and ask instead. That's why the leader checks. You'll never out-work it. You CAN out-lead it.\" TRANSITION: \"Today you learn the leader's loop: quest card, roles, check the loot — then ship it or run it back. Four parts. Board.\""
  - type: cards
    minutes: 9
    title: "The Party Leader's Loop"
    items:
      - { label: 1, name: Quest Card, text: "Four parts, in writing. Skip one and the party guesses. You won't know if it's right." }
      - { label: 2, name: Roles, text: "Nobody solos the raid. Split it: a planner, a scout, a critic — same card, one slice each." }
      - { label: 3, name: Check the Loot, text: "The leader checks every output: accuracy, taste, done-ness. Nothing ships unchecked." }
      - { label: 4, name: The Verdict, text: "SHIP IT (send it) or RUN IT BACK (do it again). Every paper gets a keep-and-fix note." }
    notes: "Write the loop on the board as you go: QUEST CARD → ROLES → CHECK THE LOOT → SHIP IT or RUN IT BACK. Gloss the two verdicts out loud the first time: SHIP IT = finished and correct, send it; RUN IT BACK = do it again. Each part gets its own slide next; this one is the map."
  - type: cards
    title: "The Quest Card — Four Parts, In Writing"
    items:
      - { label: G, name: Goal, text: "What winning means. Not \"make a flyer\" — \"get 6th graders to actually show up.\"" }
      - { label: K, name: What We Know, text: "Who it's for, and what the team already has (time, place, stuff on hand)." }
      - { label: R, name: Rules of the Run, text: "The limits: length, tone, deadline. What it must do — and must NOT do." }
      - { label: D, name: Done Looks Like, text: "The exact thing handed back. A flyer draft? A numbered plan? A fact list?" }
    notes: "(If your class did the genie lesson: this is P.R.O. grown up — Purpose became Goal + What We Know, Requirements became Rules, Output became Done Looks Like.) How to score any quest card: hand it to the most literal reader in the room. If they can twist it, or have to guess, a part is missing or vague. TRANSITION: \"Let's build one together.\""
  - type: cards
    title: "Watch one get fixed — \"Plan the game night.\" becomes a quest card"
    items:
      - { label: G, name: Goal, text: "get 6th graders to actually show up to Game Night." }
      - { label: K, name: What We Know, text: "Friday, gym, 6–8 pm; we have board games and two TVs." }
      - { label: R, name: Rules of the Run, text: "school-appropriate, big readable title, 40 words max." }
      - { label: D, name: Done Looks Like, text: "one flyer draft, ready to photocopy." }
    notes: "Start with the cursed order — \"Plan the game night.\" — then build the card on the board part by part, labeling each: GOAL, WHAT WE KNOW, RULES OF THE RUN, DONE LOOKS LIKE (same wording as the lesson plan). Ask: what could a literal party member still twist? Anything they name is a missing rule. WHAT IF a student says the card is \"too long\": count it — four lines. \"Four lines now, or a flyer that says 'games all night' later.\""
  - type: quote
    quote: "Party leaders don't do the quest twice."
    sub: "When the loot is off, check the card first. If the card was clear, the fix goes to the party member."
    notes: "Say it plainly: \"Party leaders don't do the quest twice. When the loot is off, check the card first. If the card was clear, the fix goes to the party member.\" The leader's first question is always: was it on the card? TRANSITION: \"Three roles. Same card, one slice each. Here they are.\""
  - type: cards
    title: "Party Roles — Same Card, One Slice Each"
    items:
      - { label: P, name: Planner, text: "0–4 min: a numbered step list. Card silent? Write \"NOT ON THE CARD.\" 4–8 min: a time guess per step; star the riskiest." }
      - { label: S, name: Scout, text: "0–4 min: list every fact the quest needs; mark each ✓ (say how) or ? (say where). 4–8 min: turn every ? into the one question you'd ask." }
      - { label: C, name: Critic, text: "0–4 min: 2 things the people on the card care about, 1 thing they'd hate. 4–8 min: read the Planner's list; write 3 upgrades." }
    notes: "KEY — what good output looks like (Game Night card): PLANNER: 1. Pick the games and the TV setup (5 min) 2. Write the flyer title and the when/where line (5 min) 3. ★ Add a 40-word pitch (10 min) 4. Count the words, check every rule (3 min) 5. NOT ON THE CARD: who photocopies it, and how many? (Minutes 4–8 add the time guesses and the star.) SCOUT: Friday ✓ (on the card) · gym ✓ (on the card) · 6–8 pm ✓ (on the card) · both TVs actually work? ? (ask whoever runs the gym) · how many 6th graders there are ? (the front office). Questions (4–8 min): \"Do both TVs work, and can we use them Friday night?\" (gym) · \"How many 6th graders are there this year?\" (front office). CRITIC: minutes 0–4, what the people on the card care about: which games, and whether friends are going. What they'd hate: a flyer that looks like homework. Upgrades: (1) Put the TVs and the games in the title — 6th graders come for the games, not the date. (2) Cut the 40 words to 25; nobody reads a wall of text on a wall. (3) Add one line for parents: pick-up is at 8. Coaching: the planner's NOT ON THE CARD flags are gold — they're the next card's fixes. A scout's fact with no \"how we know\" is a guess wearing a costume. Vague praise from a critic doesn't count. TRANSITION: \"Page 1. Teams of 3. ONE card per team; the first name in ABC order writes. Eight minutes.\""
  - type: steps
    minutes: 24
    title: "Activity — Run the Quest"
    items:
      - { minutes: 8, name: "Write the quest card", text: "Teams of 3. Pick a quest and decide all four parts together. One card per team: the card-holder, first name in ABC order, writes it." }
      - { minutes: 8, name: "Squad works", text: "Now switch: YOU play an AI agent. Card face-up in the middle. Work SILENTLY on a blank sheet. No questions: agents can't read minds." }
      - { minutes: 8, name: "Leader review", text: "Every paper moves one seat to its owner's left. Quote one line and tick one box per row. Write keep-and-fix. Then hand it back and read your FIX line." }
    notes: "WRITE THE CARD — WHAT IF a team stalls on GOAL: \"What would make you say we won?\" TRANSITION at 8 min: \"Cards done. Card-holder, you're the Planner: page 1 face-up in the middle. Of the other two, first name in ABC order is the Scout. Sit in a triangle. The Scout sits on the Planner's left; the Critic sits on the Scout's left. For 8 minutes YOU play an AI agent. Silence starts now.\" SQUAD WORKS — in Sana's squad: DeShawn plans, Lucia scouts, Sana critiques. Papers never move mid-round. PLANT THE CURSED AMULET (minute 2; about a minute of walking; teacher only, never on the board): whisper to each Scout, \"Secret job. Make up ONE fact that sounds true, and mark it ✓ like you checked it. Tell nobody.\" Now the loot has a guess to catch: the Scout's paper goes to the Critic. At the 4-minute call: \"Critics, read your Planner's list over their shoulder — 3 upgrades. Planners, keep writing: time every step, star the riskiest. Scouts, turn each ? into a question.\" Enforce the silence — when a party member asks a question mid-round, answer: \"It's not on the card.\" The frustration is the point. Don't rescue a weak card; the review makes the failure visible and fixable. WHAT IF the class doesn't divide by 3: team of 4 = two critics in a square, same pass-left rule (both read the plan); team of 2 = drop the critic, the leader does the taste check. 30 students = 10 teams. TRANSITION at the swap: \"Time. Every paper moves one seat to its owner's left — the Planner's plan goes to the Scout, the Scout's questions go to the Critic, the Critic's list goes to the Planner. Keep your worksheet; you lead again on page 2.\" LEADER REVIEW — with that seating, Lucia (Scout) reviews DeShawn's (Planner) plan, Sana (Critic) reviews Lucia's facts, DeShawn reviews Sana's upgrades: the Critic never re-reviews the Planner's list. Every leader quotes or points to one line in every row, ticks one box per row, then writes KEEP and FIX. Last 60 seconds: \"Hand it back. FIX lines out loud: Scouts, then Critics, then Planners.\" WHAT IF a leader turns harsh: KEEP comes before FIX, and they read the note aloud to their party member. Next slide stays up during the review."
  - type: list
    title: "Check the Loot"
    items:
      - "ACCURACY — Does every fact match the card? Is every ✓ backed by a \"how we know\"?"
      - "TASTE — Right people and tone for the card? Or could it be for anybody?"
      - "DONE-NESS — Did they do their whole role card?"
      - "Each row: quote or point to a line. Tick SHIP IT (finished and correct, send it) or RUN IT BACK (do it again)."
      - "Keep-and-fix note: KEEP (what's working and why) → FIX (the exact change + why it matters)"
    notes: "Leave this up during Leader review. \"Read it like your name is on it — because it is.\" KEY — a filled CHECK row (Lucia reviewing DeShawn's plan): ACCURACY — SHIP IT: \"No made-up facts. Step 5 flags a gap instead of guessing.\" TASTE — RUN IT BACK: \"Step 3, 'Add a 40-word pitch': for who? Could be anybody.\" DONE-NESS — SHIP IT: \"Numbered, timed, one star, one NOT ON THE CARD flag.\" Exemplar note — KEEP: \"Steps 1–4 are timed, and step 5 flags a gap instead of guessing.\" FIX: \"Make step 3 'a 40-word pitch for 6th graders.' The card says who it's for.\" The card's GOAL names 6th graders, so that RUN IT BACK goes to DeShawn, not the card. KEY — THE CURSED AMULET (Sana reviewing Lucia's facts; Lucia's planted line is \"prizes for the winners ✓ (on the card)\"): a leader who CATCHES it writes ACCURACY — RUN IT BACK: \"'Prizes for the winners ✓' — the card never says prizes.\" FIX: \"Cross out prizes or change it to ?. Ask whoever runs Game Night.\" A leader who MISSES it writes ACCURACY — SHIP IT: \"Every fact has a ✓ or a ?.\" They checked that the marks were there, not that they were true. A miss costs nothing; it's a trap by design. WHAT IF a leader turns harsh: KEEP before FIX, read aloud. Last 60 seconds: Scouts read first, then Critics, then Planners. TRANSITION (the reveal): \"Critics, who found a fact that isn't on the card? Scouts, tell them: I asked you to make one up. Agents usually guess at a gap. Leaders catch it. Page 3, solo.\" Land it in one line: a ✓ is a claim, not proof."
  - type: list
    minutes: 6
    verbatim: true
    title: "Exit Ticket — Quest Card for a Real Task"
    items:
      - "1.  Write a quest card for one real task in YOUR life this week (a study plan, a chore list, a team flyer): GOAL · WHAT WE KNOW · RULES OF THE RUN · DONE LOOKS LIKE."
      - "2.  Which role should start on your task first? Check one, then write why: Planner · Scout · Critic"
      - "3.  If an AI did your task, which check would its work most likely fail? Check one, then write what to look for: Accuracy · Taste · Done-ness"
    notes: "Worksheet p.3, solo, 6 minutes. Collect. KEY — #1 exemplar (study plan): GOAL: pass Friday's fractions quiz with at least a B. WHAT WE KNOW: 7th grade math; I have the review sheet and 30 minutes a night, Monday to Thursday. RULES OF THE RUN: only fractions with different denominators, no calculator, done by Thursday night. DONE LOOKS LIKE: a four-night plan, 5 practice problems a night, answers on a separate line. Test: could a stranger do it tomorrow from the card alone? Scoring: Proficient = all four parts labeled and specific; Developing = parts present but vague (\"make it good,\" \"soon\"); Beginning = a wish, not a quest card (\"help me with math\"). #2: any role with a reason tied to the task (scout for a fact-heavy flyer; planner for a schedule) — the reason is what scores. #3: any check with something real to look for (\"accuracy — the quiz date\"; \"done-ness — did it give all four nights?\"). WHAT IF a student writes a wish: \"Which part would stop a stranger guessing? Add it.\" Sentence starters for support: Teacher Guide, p.1."
  - type: closer
    statement: "Your party is tireless. The name on the quest is YOURS."
    sub: "A good AI job runs human → AI → human: you write the card, the AI does the middle, you check the loot. If wrong facts ship, the leader said yes to them."
    notes: "Close on this — it's the leader rule from the bottom of the worksheet. This is Lesson 6 of 6, the unit finale. It also sells on its own, and every lesson in the unit stands alone. (If your class did the earlier lessons: the quest card is the genie-proof wish grown up, the accuracy check is the Fact Desk, and the taste check is the Taste File. They had the skills; today they found out the skills make them a leader.) With devices: the five-line block in the lesson plan runs one team's card on your projected account and the class checks its output with the same rubric. Hedge if asked about jobs: So far, AI mostly takes over tasks, not whole jobs. Nobody can promise the final count."
