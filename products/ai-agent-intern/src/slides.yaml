# Projectable deck for the lesson plan — every slide is a moment in the 45 minutes.
# Teacher script lives in the speaker notes; students see only what's on the slide.
kicker: The Party Leader Lesson
subtitle: "An AI agent is a party member: capable, tireless, EXTREMELY literal. Party leaders don't redo the squad's work — they write the quest card, assign the roles, and check the loot."
notes: "Open on this slide while students settle. Worksheet: Run the Quest, one per student, plus loose-leaf for squad outputs. Plan teams of 3. Fully unplugged by design."
slides:
  - type: hook
    minutes: 7
    title: "Warm-Up — It Did EXACTLY What You Said"
    headline: "My new party member: maxed-out stats, never sleeps, never complains — painfully literal."
    lines:
      - "\"Guard the door.\"  →  Guarded the door. Only the door. The enemies came in through the window."
      - "\"Grab everything in the chest.\"  →  Everything. Including the cursed amulet with the obvious skull on it."
      - "\"Wait here.\"  →  Still waiting. It has been three in-game days."
    notes: "Tell the class about last night's run and read the three orders with a straight face. Lesson 1 alumni will call it: this party member IS the literal genie — it just joined your squad. New classes need no backstory. Then advance to the question."
  - type: question
    title: "Whose fault was that?"
    question: "The party member's — or the orders?"
    sub: "An AI agent is this party member: fast, tireless, never salty — and it does exactly what the quest says."
    notes: "Bridge: \"An AI agent is this party member: fast, tireless, never salty — and it does exactly what the quest says. You'll never out-grind it. You CAN out-lead it. Today you learn the leader's loop: quest card, roles, check the loot — then ship it or run it back.\""
  - type: cards
    minutes: 10
    title: "The Party Leader's Loop"
    items:
      - { label: 1, name: Quest Card, text: "Write the job down, all four parts. If the card is vague, the squad guesses — and guesses wrong." }
      - { label: 2, name: Roles, text: "Leaders don't send one member to solo the raid. Split it: a planner, a scout, a critic — same card, one slice each." }
      - { label: 3, name: Check the Loot, text: "The leader reviews every output: accuracy, taste, done-ness. Nothing ships unchecked." }
      - { label: 4, name: Ship It or Run It Back, text: "Good work ships. Weak work gets a run-it-back note — keep + fix, specific enough that nobody guesses." }
    notes: "Write the loop on the board as you go: QUEST CARD → ROLES → CHECK THE LOOT → SHIP IT or RUN IT BACK. Each part gets its own slide next; this one is the map."
  - type: cards
    title: "The Quest Card — Four Parts, In Writing"
    items:
      - { label: G, name: Goal, text: "What winning means. Not \"make a flyer\" — \"get 6th graders to actually show up.\"" }
      - { label: K, name: What We Know, text: "Who it's for, and what the team already has (time, place, stuff on hand)." }
      - { label: R, name: Rules of the Run, text: "The limits: length, tone, deadline. What it must do — and must NOT do." }
      - { label: D, name: Done Looks Like, text: "The exact thing handed back. A flyer draft? A numbered plan? A fact list?" }
    notes: "Prompt-writers from Lesson 1: this is P.R.O. grown up. How to score any quest card: hand it to the most literal reader in the room. If they can twist it, or have to guess, a part is missing or vague."
  - type: compare
    title: "Model it live"
    left: { heading: "CURSED ORDER", text: "\"Plan the game night.\"" }
    right: { heading: "PARTY LEADER'S QUEST CARD", text: "\"GOAL: get 6th graders to actually show up to Game Night. WHAT WE KNOW: Friday, gym, 6–8 pm; we have board games and two TVs. RULES OF THE RUN: school-appropriate, big readable title, 40 words max. DONE LOOKS LIKE: one flyer draft, ready to photocopy.\"" }
    notes: "Build the right-hand card on the board part by part, labeling each: GOAL, WHAT WE KNOW, RULES OF THE RUN, DONE LOOKS LIKE. Ask: what could a literal party member still twist? Anything they name is a missing rule."
  - type: quote
    quote: "Party leaders don't do the quest twice."
    sub: "If you have to redo a party member's work, your quest card failed. Fix the card, not just the work."
    notes: "Say it plainly: \"Party leaders don't do the quest twice. If you have to redo a party member's work, your quest card failed. Fix the card, not just the work.\" Then move to the roles."
  - type: cards
    title: "Squad Roles — Same Card, One Slice Each"
    items:
      - { label: P, name: Planner, text: "Turn the card into a numbered step list with a time guess per step. If the card is silent, write \"NOT ON THE CARD\" — don't guess." }
      - { label: S, name: Scout, text: "List every fact the quest needs. Mark each ✓ verified (say where) or ? needs checking. No guesses dressed as facts." }
      - { label: C, name: Critic, text: "Write 3 specific upgrades tied to the audience on the card. \"Make it better\" is banned — name the exact change and why." }
    notes: "You are the leader; your teammates are your agents. Coaching: the planner's NOT ON THE CARD flags are gold — they're the next card's fixes. A scout's fact with no source is a guess wearing a costume. Vague praise from a critic doesn't count."
  - type: steps
    minutes: 22
    title: "Activity — Run the Quest"
    items:
      - { minutes: 6, name: "Write the quest card", text: "Teams of 3. Pick a quest — Game Night page or zine issue #1 — and write ONE card with all four parts. Everyone copies it." }
      - { minutes: 8, name: "Squad works", text: "Take a role card: planner, scout, critic. Work SILENTLY, from the card alone, on your own paper. No questions — agents can't read minds." }
      - { minutes: 8, name: "Leader review", text: "Rotate: review ONE other player's output. Run the CHECK rubric, rule SHIP IT or RUN IT BACK, and write one run-it-back note." }
    notes: "In Sana's squad: DeShawn plans, Lucia scouts, Sana critiques; then Sana reviews DeShawn, DeShawn reviews Lucia, Lucia reviews Sana. Enforce the silence — when a party member asks a question mid-round, answer: \"It's not on the card.\" The frustration is the point. Don't rescue a weak card; the review makes the failure visible and fixable. Team of 4: two critics. Team of 2: drop the critic; the leader does the taste check."
  - type: list
    title: "Check the Loot"
    items:
      - "ACCURACY — Is every stated fact verified?"
      - "TASTE — Does it fit the audience and vibe on the card, or is it generic?"
      - "DONE-NESS — Is everything the card asked for actually here?"
      - "Each check: SHIP IT or RUN IT BACK. Quote the evidence."
      - "Run-it-back note: KEEP (what works and why) → FIX (the exact change + why)"
    notes: "Leave this up during Leader review. Read it like it ships with your name on it — because it does. Exemplar note to share after round 1 — KEEP: \"The schedule works and the title is big and readable, exactly like the card asked.\" FIX: \"The flyer says 'games all night' — Game Night ends at 8 pm. Fix the time, then re-check every fact against the card.\" If a leader turns harsh: KEEP comes before FIX, and they read the note aloud to their party member."
  - type: list
    minutes: 6
    title: "Exit Ticket — Quest Card for a Real Task"
    items:
      - "Pick one real task in YOUR life to hand an AI agent this week — a study plan, a chore schedule, a team flyer."
      - "Write the full quest card, all four parts labeled: GOAL · WHAT WE KNOW · RULES OF THE RUN · DONE LOOKS LIKE."
      - "Test: could a stranger do the task tomorrow from your card alone?"
    notes: "Worksheet p.2. Collect. Scoring: Proficient = all four parts labeled, specific enough that a stranger could do it tomorrow. Developing = parts present but vague (\"make it good,\" \"soon\"). Beginning = a wish, not a quest card (\"help me with math\"). Sentence starters for support are in the Teacher Guide, p.3."
  - type: closer
    statement: "Your squad is tireless. The name on the quest is YOURS."
    sub: "If wrong facts ship, the leader signed off. Check like it matters."
    notes: "Close on this — it's the leader rule from the bottom of the worksheet. This is Lesson 6 of 6, the capstone: the quest card is Lesson 1's prompting, the accuracy check is Lesson 3's fact desk, the taste check is Lesson 4's feedback eye. They already had the skills; today they found out the skills make them a leader. With devices: run a team's card through a real AI tool and review its output with the same rubric."
