description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  An AI agent runs the whole quest alone, and it guesses wherever your orders are vague.

  In Run the Quest, teams write one quest card, play the AI squad in silence, then check each other's loot.

  This is the skill adults call delegation, in the language every middle schooler already speaks.

  The 45 minutes open with your painfully literal new party member. You said "guard the door," so it guarded the door, and the enemies used the window. You said "get us potions," so it guessed how many and spent all the gold. You'll never out-work it. You CAN out-lead it. Then comes the Party Leader's Loop, four moves on the board: write the QUEST CARD, hand out the ROLES, CHECK THE LOOT, then SHIP IT or RUN IT BACK.

  Each team plans a real class project from ONE shared quest card, either a Game Night flyer or the first issue of a class magazine. For eight silent minutes, each kid plays one AI agent, as the planner, the scout, or the critic. No questions allowed, because agents can't read minds. Then every paper moves, and everyone becomes the leader.

  Leaders score the work with the CHECK rubric for accuracy, taste, and done-ness. They mark SHIP IT or RUN IT BACK on each row and write a keep-and-fix note. One whispered line from you plants a fake fact in every team's loot, so every review has a real guess to catch. Vague quest cards fail in front of the whole squad, and that failure is the lesson. It teaches AI literacy, teamwork, and project planning in one 45-minute quest.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, a quoted transition at every seam, a what-if under each. Plus the exact whisper that plants the fake fact, and a 5-line with-devices block that runs one team's card on your projected account.
  • Run the Quest worksheet, 3 pages. Quest card builder, role cards, the CHECK rubric with check-box verdicts, a keep-and-fix note, and a 3-part exit ticket.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. Two exemplar quest cards, exemplar output for all three roles, a filled CHECK row and note, and a catch-or-miss key for the planted fact. Plus an exit-ticket key and a taught and assessed standards map.
  • Slide deck, 12 slides (.pptx). Teacher script and keys sit in the speaker notes. It opens in PowerPoint, Keynote, or Google Slides.
  • Support, Extension, ELL, and no-device variants, written into the plan.
  Students need the worksheet and scrap paper, nothing else. Where you have devices, the plan says exactly what they add. Zero prep: print it tonight, teach it tomorrow.

  Standards: ISTE 1.5.c, ISTE 1.7.c, CCSS ELA W.6.4.

  Lesson 6 of 6 in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
