description: |
  AI agents are here, and your students will manage them — not the other way around. This no-prep, 45-minute capstone teaches delegation as a life skill, with zero devices required.

  The hook: an AI agent is a capable, tireless, EXTREMELY literal intern. Good bosses don't do the work twice — they write a clear BRIEF (goal, context, constraints, deliverable), split the job into ROLES (planner, researcher, critic), and CHECK the work (accuracy, taste, done-ness) before it ships. In the main activity, Run the Project, teams of three plan a real-feeling class project — a Game Night page or a class zine issue. Each teammate plays one agent role and executes ONLY the brief, silently. Then the rotating boss reviews each output against a printed CHECK rubric and writes a send-back note. Vague briefs fail in front of everyone — and that failure is the lesson.

  This is Lesson 6 of 6 in the Future Skills AI Literacy unit, and it deliberately pulls the whole unit together: prompting becomes the brief, fact-checking becomes the accuracy check, feedback-and-taste becomes the taste check. It also stands 100% alone — everything a first-time class needs is on the page.

  INCLUDES: full scripted lesson plan (45 min), Run the Project student worksheet (brief builder, role cards, CHECK rubric, send-back note), teacher guide with exemplar brief, role coaching, exemplar send-back note, and exit-ticket scoring, plus a with-devices variant that runs the team's brief against a real AI tool.

  Aligned to ISTE Standards for Students (1.5.c, 1.7.c) and CCSS ELA W.6.4, each taught in a named activity and assessed by a named item. Zero prep: print and teach the same morning.
