description: |
  NO STUDENT AI ACCOUNTS NEEDED. Every lesson in this unit runs fully unplugged — on paper, with partners — so it works in districts that restrict student AI use or devices, and in any classroom without reliable tech. Where devices are available, each plan says exactly what they add.
  AI agents are here, and your students will lead them — not the other way around. This no-prep, 45-minute capstone teaches the skill adults call delegation, in the language every middle schooler already speaks: leading a game squad. Zero devices required.

  The hook: an AI agent is a party member — capable, tireless, and EXTREMELY literal. Party leaders don't redo the squad's work, they review it. They write a clear QUEST CARD (the goal, what the team knows, the rules of the run, what done looks like), assign ROLES (planner, scout, critic), and CHECK THE LOOT (accuracy, taste, done-ness) before anything ships. In the main activity, Run the Quest, teams of three plan a real-feeling class project — a Game Night page or a class zine issue. Each teammate plays one agent role and works ONLY from the quest card, silently. Then the rotating party leader reviews each output against a printed CHECK rubric and writes a run-it-back note. Vague quest cards fail in front of everyone — and that failure is the lesson.

  This is Lesson 6 of 6 in the Future Skills AI Literacy unit, and it deliberately pulls the whole unit together: prompting becomes the quest card, fact-checking becomes the accuracy check, feedback-and-taste becomes the taste check. It also stands 100% alone — everything a first-time class needs is on the page.

  INCLUDES: full scripted lesson plan (45 min), Run the Quest student worksheet (quest card builder, role cards, CHECK rubric, run-it-back note, exit ticket), teacher guide with exemplar quest card, role coaching, exemplar run-it-back note, and exit-ticket scoring, plus a with-devices variant that runs the team's quest card against a real AI tool.

  Aligned to ISTE Standards for Students (1.5.c, 1.7.c) and CCSS ELA W.6.4, each taught in a named activity and assessed by a named item. Zero prep: print and teach the same morning.
