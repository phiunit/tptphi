description: |
  NO STUDENT AI ACCOUNTS NEEDED. This lesson runs on paper.

  An AI agent does a multi-step job on its own. Where your card is vague, it guesses forward.

  In Run the Quest, teams of three write one quest card, play the roles, then lead the review of a teammate's work.

  The 45 minutes open with your painfully literal new party member. You said "guard the door," so it guarded the door, and the enemies came in through the window. Students then learn the Party Leader's Loop, which has four moves. Write the QUEST CARD: goal, what we know, rules of the run, done looks like. Hand out the ROLES of planner, scout and critic.

  Then CHECK THE LOOT for accuracy, taste and done-ness, and either SHIP IT or RUN IT BACK. Each team plans a real-feeling class project from ONE shared quest card, either a Game Night flyer or a class magazine's first issue. Each teammate plays one agent role silently, and papers pass one seat left. Then everyone becomes the leader. They run the printed CHECK rubric, check SHIP IT or RUN IT BACK per check, and write a keep-and-fix note.

  Vague quest cards fail in front of everyone, and that failure is the lesson. This is the skill adults call delegation, in the language every middle schooler already speaks.

  WHAT YOU GET
  • Lesson plan, 2 pages. Every block timed to 45 minutes, a quoted transition at every seam, a what-if under each. Plus a 5-line with-devices block that runs one team's card on your projected account.
  • Run the Quest worksheet, 2 pages. Quest card builder, role cards, the CHECK rubric with check-box verdicts, a run-it-back note, and a 3-part exit ticket.
  • Fillable worksheet PDF. Students type into it on Chromebooks and tablets.
  • Teacher guide, 3 pages. An exemplar quest card, exemplar output for all three roles, a filled CHECK row and note. Plus an exit-ticket key and a taught and assessed standards map.
  • Slide deck, 12 slides (.pptx). Teacher script and keys sit in the speaker notes. It opens in PowerPoint, Keynote or Google Slides.
  • Support, Extension, ELL and no-device variants, written into the plan.
  Students need the worksheet and scrap paper, nothing else. Where you have devices, the plan says exactly what they add. Zero prep: print it tonight, teach it tomorrow.

  Standards: ISTE 1.5.c, ISTE 1.7.c, CCSS ELA W.6.4.

  Lesson 6 of six in the AI Literacy unit. It stands alone, and the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
