description: |
  NO STUDENT AI ACCOUNTS NEEDED — this lesson runs fully on paper. The hook: an AI agent does a multi-step job on its own — and where your card is vague, it guesses forward — so in Run the Quest, teams of three write one quest card, play the agent roles from the shared card, and then lead the review of a teammate's work.

  The 45-minute lesson opens with your painfully literal new party member ("Guard the door." → guarded the door; the enemies came in through the window). Students learn the Party Leader's Loop: write the QUEST CARD (goal, what we know, rules of the run, done looks like), hand out the ROLES (planner, scout, critic), CHECK THE LOOT (accuracy, taste, done-ness), then SHIP IT or RUN IT BACK. In Run the Quest, each team plans a real-feeling class project — a Game Night flyer or a class magazine's first issue — from ONE shared quest card. Each teammate plays one agent role silently, papers pass one seat left, and everyone becomes the leader: they run the printed CHECK rubric, check SHIP IT or RUN IT BACK per check, and write a keep-and-fix note. Vague quest cards fail in front of everyone — and that failure is the lesson. The skill adults call delegation, in the language every middle schooler already speaks.

  INCLUDES: the lesson plan (2 pages: every block timed to 45 minutes, a quoted transition at every seam, a what-if under every block, and a real five-line with-devices block that runs one team's card on the teacher's projected account); the Run the Quest worksheet (2 pages: quest card builder, role cards, CHECK rubric with check-box verdicts, run-it-back note, three-part exit ticket) plus a fillable PDF copy for Chromebooks and tablets; a teacher guide (3 pages) with a key or exemplar for every student item — exemplar quest card, exemplar output for all three roles, a filled CHECK row and note, and an exit-ticket key; a slide deck (.pptx, 12 slides, opens in PowerPoint, Keynote or Google Slides) with the teacher script and the keys in the speaker notes; and Support / Extension / ELL / no-device variants. Materials: the worksheet plus scrap paper — no devices needed; where you have them, the plan says exactly what they add. Zero prep: print and teach the same morning.

  Standards: ISTE 1.5.c, ISTE 1.7.c, CCSS ELA W.6.4.

  Lesson 6 of 6 in the AI Literacy unit — stands alone; the 6-lesson bundle saves 30%. Search the store for "AI Literacy Unit Bundle".
