      component . anchor . grade . letter). NONE of them are recorded here — no
      copy of their verbatim text was reachable in this session, and the
      process-component labels for Media Arts specifically were not verifiable.
      Do NOT write an "MA:" code into a product until someone verifies it against
      nationalartsstandards.org and adds it to this map. Cite the anchor standard
