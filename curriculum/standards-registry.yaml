        text: "Use precise words and phrases, relevant descriptive details, and sensory language to capture the action and convey experiences and events."
        full: "CCSS.ELA-LITERACY.W.8.3d"
        verified: true
      "W.8.3e":
        text: "Provide a conclusion that follows from and reflects on the narrated experiences or events."
        full: "CCSS.ELA-LITERACY.W.8.3e"
        verified: true
      "W.8.4":
        text: "Produce clear and coherent writing in which the development, organization, and style are appropriate to task, purpose, and audience. (Grade-specific expectations for writing types are defined in standards 1-3 above.)"
        full: "CCSS.ELA-LITERACY.W.8.4"
        verified: true
      "W.8.5":
        text: "With some guidance and support from peers and adults, develop and strengthen writing as needed by planning, revising, editing, rewriting, or trying a new approach, focusing on how well purpose and audience have been addressed. (Editing for conventions should demonstrate command of Language standards 1-3 up to and including grade 8 here.)"
        full: "CCSS.ELA-LITERACY.W.8.5"
        verified: true
      "W.8.6":
        text: "Use technology, including the Internet, to produce and publish writing and present the relationships between information and ideas efficiently as well as to interact and collaborate with others."
        full: "CCSS.ELA-LITERACY.W.8.6"
        verified: true
      "W.8.7":
        text: "Conduct short research projects to answer a question (including a self-generated question), drawing on several sources and generating additional related, focused questions that allow for multiple avenues of exploration."
        full: "CCSS.ELA-LITERACY.W.8.7"
        verified: true
      "W.8.8":
        text: "Gather relevant information from multiple print and digital sources, using search terms effectively; assess the credibility and accuracy of each source; and quote or paraphrase the data and conclusions of others while avoiding plagiarism and following a standard format for citation."
        full: "CCSS.ELA-LITERACY.W.8.8"
        verified: true
      "W.8.9":
        text: "Draw evidence from literary or informational texts to support analysis, reflection, and research."
        full: "CCSS.ELA-LITERACY.W.8.9"
        verified: true
      "W.8.9a":
        text: "Apply grade 8 Reading standards to literature (e.g., \"Analyze how a modern work of fiction draws on themes, patterns of events, or character types from myths, traditional stories, or religious works such as the Bible, including describing how the material is rendered new\")."
        full: "CCSS.ELA-LITERACY.W.8.9a"
        verified: true
      "W.8.9b":
        text: "Apply grade 8 Reading standards to literary nonfiction (e.g., \"Delineate and evaluate the argument and specific claims in a text, assessing whether the reasoning is sound and the evidence is relevant and sufficient; recognize when irrelevant evidence is introduced\")."
        full: "CCSS.ELA-LITERACY.W.8.9b"
        verified: true
      "W.8.10":
        text: "Write routinely over extended time frames (time for research, reflection, and revision) and shorter time frames (a single sitting or a day or two) for a range of discipline-specific tasks, purposes, and audiences."
        full: "CCSS.ELA-LITERACY.W.8.10"
        verified: true
      "SL.6.1":
        text: "Engage effectively in a range of collaborative discussions (one-on-one, in groups, and teacher-led) with diverse partners on grade 6 topics, texts, and issues, building on others' ideas and expressing their own clearly."
        full: "CCSS.ELA-LITERACY.SL.6.1"
        verified: true
      "SL.6.1a":
        text: "Come to discussions prepared, having read or studied required material; explicitly draw on that preparation by referring to evidence on the topic, text, or issue to probe and reflect on ideas under discussion."
        full: "CCSS.ELA-LITERACY.SL.6.1a"
        verified: true
      "SL.6.1b":
        text: "Follow rules for collegial discussions, set specific goals and deadlines, and define individual roles as needed."
        full: "CCSS.ELA-LITERACY.SL.6.1b"
        verified: true
      "SL.6.1c":
        text: "Pose and respond to specific questions with elaboration and detail by making comments that contribute to the topic, text, or issue under discussion."
        full: "CCSS.ELA-LITERACY.SL.6.1c"
        verified: true
      "SL.6.1d":
        text: "Review the key ideas expressed and demonstrate understanding of multiple perspectives through reflection and paraphrasing."
        full: "CCSS.ELA-LITERACY.SL.6.1d"
        verified: true
      "SL.6.2":
        text: "Interpret information presented in diverse media and formats (e.g., visually, quantitatively, orally) and explain how it contributes to a topic, text, or issue under study."
        full: "CCSS.ELA-LITERACY.SL.6.2"
        verified: true
      "SL.6.3":
        text: "Delineate a speaker's argument and specific claims, distinguishing claims that are supported by reasons and evidence from claims that are not."
        full: "CCSS.ELA-LITERACY.SL.6.3"
        verified: true
      "SL.6.4":
        text: "Present claims and findings, sequencing ideas logically and using pertinent descriptions, facts, and details to accentuate main ideas or themes; use appropriate eye contact, adequate volume, and clear pronunciation."
        full: "CCSS.ELA-LITERACY.SL.6.4"
        verified: true
      "SL.6.5":
        text: "Include multimedia components (e.g., graphics, images, music, sound) and visual displays in presentations to clarify information."
        full: "CCSS.ELA-LITERACY.SL.6.5"
        verified: true
      "SL.6.6":
        text: "Adapt speech to a variety of contexts and tasks, demonstrating command of formal English when indicated or appropriate. (See grade 6 Language standards 1 and 3 here for specific expectations.)"
        full: "CCSS.ELA-LITERACY.SL.6.6"
        verified: true
      "SL.7.1":
        text: "Engage effectively in a range of collaborative discussions (one-on-one, in groups, and teacher-led) with diverse partners on grade 7 topics, texts, and issues, building on others' ideas and expressing their own clearly."
        full: "CCSS.ELA-LITERACY.SL.7.1"
        verified: true
      "SL.7.1a":
        text: "Come to discussions prepared, having read or researched material under study; explicitly draw on that preparation by referring to evidence on the topic, text, or issue to probe and reflect on ideas under discussion."
        full: "CCSS.ELA-LITERACY.SL.7.1a"
        verified: true
      "SL.7.1b":
        text: "Follow rules for collegial discussions, track progress toward specific goals and deadlines, and define individual roles as needed."
        full: "CCSS.ELA-LITERACY.SL.7.1b"
        verified: true
      "SL.7.1c":
        text: "Pose questions that elicit elaboration and respond to others' questions and comments with relevant observations and ideas that bring the discussion back on topic as needed."
        full: "CCSS.ELA-LITERACY.SL.7.1c"
        verified: true
      "SL.7.1d":
        text: "Acknowledge new information expressed by others and, when warranted, modify their own views."
        full: "CCSS.ELA-LITERACY.SL.7.1d"
        verified: true
      "SL.7.2":
        text: "Analyze the main ideas and supporting details presented in diverse media and formats (e.g., visually, quantitatively, orally) and explain how the ideas clarify a topic, text, or issue under study."
        full: "CCSS.ELA-LITERACY.SL.7.2"
        verified: true
      "SL.7.3":
        text: "Delineate a speaker's argument and specific claims, evaluating the soundness of the reasoning and the relevance and sufficiency of the evidence."
        full: "CCSS.ELA-LITERACY.SL.7.3"
        verified: true
      "SL.7.4":
        text: "Present claims and findings, emphasizing salient points in a focused, coherent manner with pertinent descriptions, facts, details, and examples; use appropriate eye contact, adequate volume, and clear pronunciation."
        full: "CCSS.ELA-LITERACY.SL.7.4"
        verified: true
      "SL.7.5":
        text: "Include multimedia components and visual displays in presentations to clarify claims and findings and emphasize salient points."
        full: "CCSS.ELA-LITERACY.SL.7.5"
        verified: true
      "SL.7.6":
        text: "Adapt speech to a variety of contexts and tasks, demonstrating command of formal English when indicated or appropriate. (See grade 7 Language standards 1 and 3 here for specific expectations.)"
        full: "CCSS.ELA-LITERACY.SL.7.6"
        verified: true
      "SL.8.1":
        text: "Engage effectively in a range of collaborative discussions (one-on-one, in groups, and teacher-led) with diverse partners on grade 8 topics, texts, and issues, building on others' ideas and expressing their own clearly."
        full: "CCSS.ELA-LITERACY.SL.8.1"
        verified: true
      "SL.8.1a":
        text: "Come to discussions prepared, having read or researched material under study; explicitly draw on that preparation by referring to evidence on the topic, text, or issue to probe and reflect on ideas under discussion."
        full: "CCSS.ELA-LITERACY.SL.8.1a"
        verified: true
      "SL.8.1b":
        text: "Follow rules for collegial discussions and decision-making, track progress toward specific goals and deadlines, and define individual roles as needed."
        full: "CCSS.ELA-LITERACY.SL.8.1b"
        verified: true
      "SL.8.1c":
        text: "Pose questions that connect the ideas of several speakers and respond to others' questions and comments with relevant evidence, observations, and ideas."
        full: "CCSS.ELA-LITERACY.SL.8.1c"
        verified: true
      "SL.8.1d":
        text: "Acknowledge new information expressed by others, and, when warranted, qualify or justify their own views in light of the evidence presented."
        full: "CCSS.ELA-LITERACY.SL.8.1d"
        verified: true
      "SL.8.2":
        text: "Analyze the purpose of information presented in diverse media and formats (e.g., visually, quantitatively, orally) and evaluate the motives (e.g., social, commercial, political) behind its presentation."
        full: "CCSS.ELA-LITERACY.SL.8.2"
        verified: true
      "SL.8.3":
        text: "Delineate a speaker's argument and specific claims, evaluating the soundness of the reasoning and relevance and sufficiency of the evidence and identifying when irrelevant evidence is introduced."
        full: "CCSS.ELA-LITERACY.SL.8.3"
        verified: true
      "SL.8.4":
        text: "Present claims and findings, emphasizing salient points in a focused, coherent manner with relevant evidence, sound valid reasoning, and well-chosen details; use appropriate eye contact, adequate volume, and clear pronunciation."
        full: "CCSS.ELA-LITERACY.SL.8.4"
        verified: true
      "SL.8.5":
        text: "Integrate multimedia and visual displays into presentations to clarify information, strengthen claims and evidence, and add interest."
        full: "CCSS.ELA-LITERACY.SL.8.5"
        verified: true
      "SL.8.6":
        text: "Adapt speech to a variety of contexts and tasks, demonstrating command of formal English when indicated or appropriate. (See grade 8 Language standards 1 and 3 here for specific expectations.)"
        full: "CCSS.ELA-LITERACY.SL.8.6"
        verified: true

  CCSS-MATH:
    name: "Common Core State Standards for Mathematics, grades 6-7 — Ratios & Proportional Relationships (RP), Expressions & Equations (EE), Statistics & Probability (SP)"
    publisher: "NGA Center for Best Practices / Council of Chief State School Officers"
    source: "https://www.thecorestandards.org/Math/"
    primary_source_confirmed: false
    key_format: >-
      Keys include the cluster letter (6.RP.A.3), which is the canonical CCSS form.
      Many teachers and some state crosswalks drop it (6.RP.3); `alt` records that
      spelling so the validator accepts either. Prefer the canonical form.
    scope_note: >-
      Grade 8 has no RP domain (proportional reasoning moves into 8.EE/8.F), so
      6-7 is the correct band for ratio, unit-rate, percent and probability work —
      which is where the finance line and the game-balance lessons live.
    verification_copies:
      - label: "corestandards.org competency-framework export (rows carry http://corestandards.org/Math/Content/... URIs)"
        url: "https://raw.githubusercontent.com/eldoomCBE/moodlenet_repo/master/assets/529_CCSS.Math_httpcorestandards.orgMath_20170106_0445_comma_separated.csv"
      - label: "ASN/CASE framework export of CCSS Math grades 6 and 7 (independent, ASN identifiers + exactMatch URIs)"
        url: "https://raw.githubusercontent.com/artpromedia/AIVO-LMS/main/packages/content-pack/data/sources/ccss/math-grade-6.json"
      - label: "Code.org ccmath_standards.csv (third check, prefix match only)"
        url: "https://raw.githubusercontent.com/code-dot-org/code-dot-org/staging/dashboard/config/standards/ccmath_standards.csv"
    transcription_note: >-
      Both exports render math typography in ASCII: en-dashes in subtraction
      examples appear as "-" and curly quotes as straight quotes. Wording is
      verbatim; those two glyphs may differ cosmetically from the PDF. The
      italicised "For example ..." illustrations ARE part of the standard and are
      kept here — the CASE copy stores them separately, which is the only reason
      the two copies differ in length.
    all_54_corroborated_by_two_or_more_copies: true
    clusters:
      "6.EE.A": "Grade 6 » Expressions & Equations » Apply and extend previous understandings of arithmetic to algebraic expressions."
      "6.EE.B": "Grade 6 » Expressions & Equations » Reason about and solve one-variable equations and inequalities."
      "6.EE.C": "Grade 6 » Expressions & Equations » Represent and analyze quantitative relationships between dependent and independent variables."
      "6.RP.A": "Grade 6 » Ratios & Proportional Relationships » Understand ratio concepts and use ratio reasoning to solve problems."
      "6.SP.A": "Grade 6 » Statistics & Probability » Develop understanding of statistical variability."
      "6.SP.B": "Grade 6 » Statistics & Probability » Summarize and describe distributions."
      "7.EE.A": "Grade 7 » Expressions & Equations » Use properties of operations to generate equivalent expressions."
      "7.EE.B": "Grade 7 » Expressions & Equations » Solve real-life and mathematical problems using numerical and algebraic expressions and equations."
      "7.RP.A": "Grade 7 » Ratios & Proportional Relationships » Analyze proportional relationships and use them to solve real-world and mathematical problems."
      "7.SP.A": "Grade 7 » Statistics & Probability » Use random sampling to draw inferences about a population."
      "7.SP.B": "Grade 7 » Statistics & Probability » Draw informal comparative inferences about two populations."
      "7.SP.C": "Grade 7 » Statistics & Probability » Investigate chance processes and develop, use, and evaluate probability models."
    codes:
      "6.RP.A.1":
        text: "Understand the concept of a ratio and use ratio language to describe a ratio relationship between two quantities. For example, \"The ratio of wings to beaks in the bird house at the zoo was 2:1, because for every 2 wings there was 1 beak.\" \"For every vote candidate A received, candidate C received nearly three votes.\""
        full: "CCSS.MATH.CONTENT.6.RP.A.1"
        alt: "6.RP.1"
        verified: true
      "6.RP.A.2":
        text: "Understand the concept of a unit rate a/b associated with a ratio a:b with b ≠ 0, and use rate language in the context of a ratio relationship. For example, \"This recipe has a ratio of 3 cups of flour to 4 cups of sugar, so there is 3/4 cup of flour for each cup of sugar.\" \"We paid $75 for 15 hamburgers, which is a rate of $5 per hamburger.\"1"
        full: "CCSS.MATH.CONTENT.6.RP.A.2"
        alt: "6.RP.2"
        verified: true
      "6.RP.A.3":
        text: "Use ratio and rate reasoning to solve real-world and mathematical problems, e.g., by reasoning about tables of equivalent ratios, tape diagrams, double number line diagrams, or equations."
        full: "CCSS.MATH.CONTENT.6.RP.A.3"
        alt: "6.RP.3"
        verified: true
      "6.RP.A.3a":
        text: "Make tables of equivalent ratios relating quantities with whole-number measurements, find missing values in the tables, and plot the pairs of values on the coordinate plane. Use tables to compare ratios."
        full: "CCSS.MATH.CONTENT.6.RP.A.3a"
        alt: "6.RP.3.a"
        verified: true
      "6.RP.A.3b":
        text: "Solve unit rate problems including those involving unit pricing and constant speed. For example, if it took 7 hours to mow 4 lawns, then at that rate, how many lawns could be mowed in 35 hours? At what rate were lawns being mowed?"
        full: "CCSS.MATH.CONTENT.6.RP.A.3b"
        alt: "6.RP.3.b"
        verified: true
      "6.RP.A.3c":
        text: "Find a percent of a quantity as a rate per 100 (e.g., 30% of a quantity means 30/100 times the quantity); solve problems involving finding the whole, given a part and the percent."
        full: "CCSS.MATH.CONTENT.6.RP.A.3c"
        alt: "6.RP.3.c"
        verified: true
      "6.RP.A.3d":
        text: "Use ratio reasoning to convert measurement units; manipulate and transform units appropriately when multiplying or dividing quantities."
        full: "CCSS.MATH.CONTENT.6.RP.A.3d"
        alt: "6.RP.3.d"
        verified: true
      "6.EE.A.1":
        text: "Write and evaluate numerical expressions involving whole-number exponents."
        full: "CCSS.MATH.CONTENT.6.EE.A.1"
        alt: "6.EE.1"
        verified: true
      "6.EE.A.2":
        text: "Write, read, and evaluate expressions in which letters stand for numbers."
        full: "CCSS.MATH.CONTENT.6.EE.A.2"
        alt: "6.EE.2"
        verified: true
      "6.EE.A.2a":
        text: "Write expressions that record operations with numbers and with letters standing for numbers. For example, express the calculation \"Subtract y from 5\" as 5 - y."
        full: "CCSS.MATH.CONTENT.6.EE.A.2a"
        alt: "6.EE.2.a"
        verified: true
      "6.EE.A.2b":
        text: "Identify parts of an expression using mathematical terms (sum, term, product, factor, quotient, coefficient); view one or more parts of an expression as a single entity. For example, describe the expression 2 (8 + 7) as a product of two factors; view (8 + 7) as both a single entity and a sum of two terms."
        full: "CCSS.MATH.CONTENT.6.EE.A.2b"
        alt: "6.EE.2.b"
        verified: true
      "6.EE.A.2c":
        text: "Evaluate expressions at specific values of their variables. Include expressions that arise from formulas used in real-world problems. Perform arithmetic operations, including those involving whole-number exponents, in the conventional order when there are no parentheses to specify a particular order (Order of Operations). For example, use the formulas V = s3 and A = 6 s2 to find the volume and surface area of a cube with sides of length s = 1/2."
        full: "CCSS.MATH.CONTENT.6.EE.A.2c"
        alt: "6.EE.2.c"
        verified: true
      "6.EE.A.3":
        text: "Apply the properties of operations to generate equivalent expressions. For example, apply the distributive property to the expression 3 (2 + x) to produce the equivalent expression 6 + 3x; apply the distributive property to the expression 24x + 18y to produce the equivalent expression 6 (4x + 3y); apply properties of operations to y + y + y to produce the equivalent expression 3y."
        full: "CCSS.MATH.CONTENT.6.EE.A.3"
        alt: "6.EE.3"
        verified: true
      "6.EE.A.4":
        text: "Identify when two expressions are equivalent (i.e., when the two expressions name the same number regardless of which value is substituted into them). For example, the expressions y + y + y and 3y are equivalent because they name the same number regardless of which number y stands for.."
        full: "CCSS.MATH.CONTENT.6.EE.A.4"
        alt: "6.EE.4"
        verified: true
      "6.EE.B.5":
        text: "Understand solving an equation or inequality as a process of answering a question: which values from a specified set, if any, make the equation or inequality true? Use substitution to determine whether a given number in a specified set makes an equation or inequality true."
        full: "CCSS.MATH.CONTENT.6.EE.B.5"
        alt: "6.EE.5"
        verified: true
      "6.EE.B.6":
        text: "Use variables to represent numbers and write expressions when solving a real-world or mathematical problem; understand that a variable can represent an unknown number, or, depending on the purpose at hand, any number in a specified set."
        full: "CCSS.MATH.CONTENT.6.EE.B.6"
        alt: "6.EE.6"
        verified: true
      "6.EE.B.7":
        text: "Solve real-world and mathematical problems by writing and solving equations of the form x + p = q and px = q for cases in which p, q and x are all nonnegative rational numbers."
        full: "CCSS.MATH.CONTENT.6.EE.B.7"
        alt: "6.EE.7"
        verified: true
      "6.EE.B.8":
        text: "Write an inequality of the form x > c or x < c to represent a constraint or condition in a real-world or mathematical problem. Recognize that inequalities of the form x > c or x < c have infinitely many solutions; represent solutions of such inequalities on number line diagrams."
        full: "CCSS.MATH.CONTENT.6.EE.B.8"
        alt: "6.EE.8"
        verified: true
      "6.EE.C.9":
        text: "Use variables to represent two quantities in a real-world problem that change in relationship to one another; write an equation to express one quantity, thought of as the dependent variable, in terms of the other quantity, thought of as the independent variable. Analyze the relationship between the dependent and independent variables using graphs and tables, and relate these to the equation. For example, in a problem involving motion at constant speed, list and graph ordered pairs of distances and times, and write the equation d = 65t to represent the relationship between distance and time."
        full: "CCSS.MATH.CONTENT.6.EE.C.9"
        alt: "6.EE.9"
        verified: true
      "6.SP.A.1":
        text: "Recognize a statistical question as one that anticipates variability in the data related to the question and accounts for it in the answers. For example, \"How old am I?\" is not a statistical question, but \"How old are the students in my school?\" is a statistical question because one anticipates variability in students' ages."
        full: "CCSS.MATH.CONTENT.6.SP.A.1"
        alt: "6.SP.1"
        verified: true
      "6.SP.A.2":
        text: "Understand that a set of data collected to answer a statistical question has a distribution which can be described by its center, spread, and overall shape."
        full: "CCSS.MATH.CONTENT.6.SP.A.2"
        alt: "6.SP.2"
        verified: true
      "6.SP.A.3":
        text: "Recognize that a measure of center for a numerical data set summarizes all of its values with a single number, while a measure of variation describes how its values vary with a single number."
        full: "CCSS.MATH.CONTENT.6.SP.A.3"
        alt: "6.SP.3"
        verified: true
      "6.SP.B.4":
        text: "Display numerical data in plots on a number line, including dot plots, histograms, and box plots."
        full: "CCSS.MATH.CONTENT.6.SP.B.4"
        alt: "6.SP.4"
        verified: true
      "6.SP.B.5":
        text: "Summarize numerical data sets in relation to their context, such as by:"
        full: "CCSS.MATH.CONTENT.6.SP.B.5"
        alt: "6.SP.5"
        verified: true
      "6.SP.B.5a":
        text: "Reporting the number of observations."
        full: "CCSS.MATH.CONTENT.6.SP.B.5a"
        alt: "6.SP.5.a"
        verified: true
      "6.SP.B.5b":
        text: "Describing the nature of the attribute under investigation, including how it was measured and its units of measurement."
        full: "CCSS.MATH.CONTENT.6.SP.B.5b"
        alt: "6.SP.5.b"
        verified: true
      "6.SP.B.5c":
        text: "Giving quantitative measures of center (median and/or mean) and variability (interquartile range and/or mean absolute deviation), as well as describing any overall pattern and any striking deviations from the overall pattern with reference to the context in which the data were gathered."
        full: "CCSS.MATH.CONTENT.6.SP.B.5c"
        alt: "6.SP.5.c"
        verified: true
      "6.SP.B.5d":
        text: "Relating the choice of measures of center and variability to the shape of the data distribution and the context in which the data were gathered."
        full: "CCSS.MATH.CONTENT.6.SP.B.5d"
        alt: "6.SP.5.d"
        verified: true
      "7.RP.A.1":
        text: "Compute unit rates associated with ratios of fractions, including ratios of lengths, areas and other quantities measured in like or different units. For example, if a person walks 1/2 mile in each 1/4 hour, compute the unit rate as the complex fraction 1/2/1/4 miles per hour, equivalently 2 miles per hour."
        full: "CCSS.MATH.CONTENT.7.RP.A.1"
        alt: "7.RP.1"
        verified: true
      "7.RP.A.2":
        text: "Recognize and represent proportional relationships between quantities."
        full: "CCSS.MATH.CONTENT.7.RP.A.2"
        alt: "7.RP.2"
        verified: true
      "7.RP.A.2a":
        text: "Decide whether two quantities are in a proportional relationship, e.g., by testing for equivalent ratios in a table or graphing on a coordinate plane and observing whether the graph is a straight line through the origin."
        full: "CCSS.MATH.CONTENT.7.RP.A.2a"
        alt: "7.RP.2.a"
        verified: true
      "7.RP.A.2b":
        text: "Identify the constant of proportionality (unit rate) in tables, graphs, equations, diagrams, and verbal descriptions of proportional relationships."
        full: "CCSS.MATH.CONTENT.7.RP.A.2b"
        alt: "7.RP.2.b"
        verified: true
      "7.RP.A.2c":
        text: "Represent proportional relationships by equations. For example, if total cost t is proportional to the number n of items purchased at a constant price p, the relationship between the total cost and the number of items can be expressed as t = pn."
        full: "CCSS.MATH.CONTENT.7.RP.A.2c"
        alt: "7.RP.2.c"
        verified: true
      "7.RP.A.2d":
        text: "Explain what a point (x, y) on the graph of a proportional relationship means in terms of the situation, with special attention to the points (0, 0) and (1, r) where r is the unit rate."
        full: "CCSS.MATH.CONTENT.7.RP.A.2d"
        alt: "7.RP.2.d"
        verified: true
      "7.RP.A.3":
        text: "Use proportional relationships to solve multistep ratio and percent problems. Examples: simple interest, tax, markups and markdowns, gratuities and commissions, fees, percent increase and decrease, percent error."
        full: "CCSS.MATH.CONTENT.7.RP.A.3"
        alt: "7.RP.3"
        verified: true
      "7.EE.A.1":
        text: "Apply properties of operations as strategies to add, subtract, factor, and expand linear expressions with rational coefficients."
        full: "CCSS.MATH.CONTENT.7.EE.A.1"
        alt: "7.EE.1"
        verified: true
      "7.EE.A.2":
        text: "Understand that rewriting an expression in different forms in a problem context can shed light on the problem and how the quantities in it are related. For example, a + 0.05a = 1.05a means that \"increase by 5%\" is the same as \"multiply by 1.05.\""
        full: "CCSS.MATH.CONTENT.7.EE.A.2"
        alt: "7.EE.2"
        verified: true
      "7.EE.B.3":
        text: "Solve multi-step real-life and mathematical problems posed with positive and negative rational numbers in any form (whole numbers, fractions, and decimals), using tools strategically. Apply properties of operations to calculate with numbers in any form; convert between forms as appropriate; and assess the reasonableness of answers using mental computation and estimation strategies. For example: If a woman making $25 an hour gets a 10% raise, she will make an additional 1/10 of her salary an hour, or $2.50, for a new salary of $27.50. If you want to place a towel bar 9 3/4 inches long in the center of a door that is 27 1/2 inches wide, you will need to place the bar about 9 inches from each edge; this estimate can be used as a check on the exact computation."
        full: "CCSS.MATH.CONTENT.7.EE.B.3"
        alt: "7.EE.3"
        verified: true
      "7.EE.B.4":
        text: "Use variables to represent quantities in a real-world or mathematical problem, and construct simple equations and inequalities to solve problems by reasoning about the quantities."
        full: "CCSS.MATH.CONTENT.7.EE.B.4"
        alt: "7.EE.4"
        verified: true
      "7.EE.B.4a":
        text: "Solve word problems leading to equations of the form px + q = r and p(x + q) = r, where p, q, and r are specific rational numbers. Solve equations of these forms fluently. Compare an algebraic solution to an arithmetic solution, identifying the sequence of the operations used in each approach. For example, the perimeter of a rectangle is 54 cm. Its length is 6 cm. What is its width?"
        full: "CCSS.MATH.CONTENT.7.EE.B.4a"
        alt: "7.EE.4.a"
        verified: true
      "7.EE.B.4b":
        text: "Solve word problems leading to inequalities of the form px + q > r or px + q < r, where p, q, and r are specific rational numbers. Graph the solution set of the inequality and interpret it in the context of the problem. For example: As a salesperson, you are paid $50 per week plus $3 per sale. This week you want your pay to be at least $100. Write an inequality for the number of sales you need to make, and describe the solutions."
        full: "CCSS.MATH.CONTENT.7.EE.B.4b"
        alt: "7.EE.4.b"
        verified: true
      "7.SP.A.1":
        text: "Understand that statistics can be used to gain information about a population by examining a sample of the population; generalizations about a population from a sample are valid only if the sample is representative of that population. Understand that random sampling tends to produce representative samples and support valid inferences."
        full: "CCSS.MATH.CONTENT.7.SP.A.1"
        alt: "7.SP.1"
        verified: true
      "7.SP.A.2":
        text: "Use data from a random sample to draw inferences about a population with an unknown characteristic of interest. Generate multiple samples (or simulated samples) of the same size to gauge the variation in estimates or predictions. For example, estimate the mean word length in a book by randomly sampling words from the book; predict the winner of a school election based on randomly sampled survey data. Gauge how far off the estimate or prediction might be."
        full: "CCSS.MATH.CONTENT.7.SP.A.2"
        alt: "7.SP.2"
        verified: true
      "7.SP.B.3":
        text: "Informally assess the degree of visual overlap of two numerical data distributions with similar variabilities, measuring the difference between the centers by expressing it as a multiple of a measure of variability. For example, the mean height of players on the basketball team is 10 cm greater than the mean height of players on the soccer team, about twice the variability (mean absolute deviation) on either team; on a dot plot, the separation between the two distributions of heights is noticeable."
        full: "CCSS.MATH.CONTENT.7.SP.B.3"
        alt: "7.SP.3"
        verified: true
      "7.SP.B.4":
        text: "Use measures of center and measures of variability for numerical data from random samples to draw informal comparative inferences about two populations. For example, decide whether the words in a chapter of a seventh-grade science book are generally longer than the words in a chapter of a fourth-grade science book."
        full: "CCSS.MATH.CONTENT.7.SP.B.4"
        alt: "7.SP.4"
        verified: true
      "7.SP.C.5":
        text: "Understand that the probability of a chance event is a number between 0 and 1 that expresses the likelihood of the event occurring. Larger numbers indicate greater likelihood. A probability near 0 indicates an unlikely event, a probability around 1/2 indicates an event that is neither unlikely nor likely, and a probability near 1 indicates a likely event."
        full: "CCSS.MATH.CONTENT.7.SP.C.5"
        alt: "7.SP.5"
        verified: true
      "7.SP.C.6":
        text: "Approximate the probability of a chance event by collecting data on the chance process that produces it and observing its long-run relative frequency, and predict the approximate relative frequency given the probability. For example, when rolling a number cube 600 times, predict that a 3 or 6 would be rolled roughly 200 times, but probably not exactly 200 times."
        full: "CCSS.MATH.CONTENT.7.SP.C.6"
        alt: "7.SP.6"
        verified: true
      "7.SP.C.7":
        text: "Develop a probability model and use it to find probabilities of events. Compare probabilities from a model to observed frequencies; if the agreement is not good, explain possible sources of the discrepancy."
        full: "CCSS.MATH.CONTENT.7.SP.C.7"
        alt: "7.SP.7"
        verified: true
      "7.SP.C.7a":
        text: "Develop a uniform probability model by assigning equal probability to all outcomes, and use the model to determine probabilities of events. For example, if a student is selected at random from a class, find the probability that Jane will be selected and the probability that a girl will be selected."
        full: "CCSS.MATH.CONTENT.7.SP.C.7a"
        alt: "7.SP.7.a"
        verified: true
      "7.SP.C.7b":
        text: "Develop a probability model (which may not be uniform) by observing frequencies in data generated from a chance process. For example, find the approximate probability that a spinning penny will land heads up or that a tossed paper cup will land open-end down. Do the outcomes for the spinning penny appear to be equally likely based on the observed frequencies?"
        full: "CCSS.MATH.CONTENT.7.SP.C.7b"
        alt: "7.SP.7.b"
        verified: true
      "7.SP.C.8":
        text: "Find probabilities of compound events using organized lists, tables, tree diagrams, and simulation."
        full: "CCSS.MATH.CONTENT.7.SP.C.8"
        alt: "7.SP.8"
        verified: true
      "7.SP.C.8a":
        text: "Understand that, just as with simple events, the probability of a compound event is the fraction of outcomes in the sample space for which the compound event occurs."
        full: "CCSS.MATH.CONTENT.7.SP.C.8a"
        alt: "7.SP.8.a"
        verified: true
      "7.SP.C.8b":
        text: "Represent sample spaces for compound events using methods such as organized lists, tables and tree diagrams. For an event described in everyday language (e.g., \"rolling double sixes\"), identify the outcomes in the sample space which compose the event."
        full: "CCSS.MATH.CONTENT.7.SP.C.8b"
        alt: "7.SP.8.b"
        verified: true
      "7.SP.C.8c":
        text: "Design and use a simulation to generate frequencies for compound events. For example, use random digits as a simulation tool to approximate the answer to the question: If 40% of donors have type A blood, what is the probability that it will take at least 4 donors to find one with type A blood?"
        full: "CCSS.MATH.CONTENT.7.SP.C.8c"
        alt: "7.SP.8.c"
        verified: true

  NSPFE:
    name: "National Standards for Personal Financial Education (2021)"
    publisher: "Council for Economic Education and Jump$tart Coalition for Personal Financial Literacy (JOINT publication)"
    source: "https://www.councilforeconed.org/wp-content/uploads/2021/10/2021-National-Standards-for-Personal-Financial-Education.pdf"
    mirror: "https://www.jumpstart.org/education/national-standards/"
    primary_source_confirmed: false
    important_correction: >-
      Jump$tart and CEE are NOT two separate frameworks any more. In October 2021
      they jointly replaced Jump$tart's "National Standards in K-12 Personal
      Finance Education" (4th ed., 2015) and CEE's "National Standards for
      Financial Literacy" with ONE document. Citing "Jump$tart standards" and
      "CEE standards" as if they were two alignments is double-counting one
      framework, and a reviewer who knows the field will spot it.
    structure:
      topics_verified: true
      topics:
        - "Earning Income"
        - "Spending"
        - "Saving"
        - "Investing"
        - "Managing Credit"
        - "Managing Risk"
      benchmark_grades: "Standards and Learning Outcomes are set for the end of grade 4, grade 8, and grade 12"
      our_band: "grade 8 — the correct benchmark set for a 6-8 product"
    codes:
      "Earning Income":
        text: "Earning Income"
        level: topic
        verified: true
        benchmark_text_verified: false
        note: "Topic name verified. Grade-8 Learning Outcome wording NOT publicly verified in this session — cite content area only."
      "Spending":
        text: "Spending"
        level: topic
        verified: true
        benchmark_text_verified: false
        note: "Topic name verified. Grade-8 Learning Outcome wording NOT publicly verified in this session — cite content area only."
      "Saving":
        text: "Saving"
        level: topic
        verified: true
        benchmark_text_verified: false
        note: "Topic name verified. Grade-8 Learning Outcome wording NOT publicly verified in this session — cite content area only."
      "Investing":
        text: "Investing"
        level: topic
        verified: true
        benchmark_text_verified: false
        note: "Topic name verified. Grade-8 Learning Outcome wording NOT publicly verified in this session — cite content area only."
      "Managing Credit":
        text: "Managing Credit"
        level: topic
        verified: true
        benchmark_text_verified: false
        note: "Topic name verified. Grade-8 Learning Outcome wording NOT publicly verified in this session — cite content area only."
      "Managing Risk":
        text: "Managing Risk"
        level: topic
        verified: true
        benchmark_text_verified: false
        note: "Topic name verified. Grade-8 Learning Outcome wording NOT publicly verified in this session — cite content area only."
    benchmark_codes: {}
    benchmark_code_note: >-
      Individual grade-8 benchmarks appear in the wild as "<Topic> 8-<n>"
      (e.g. "Spending 8-3"), by analogy with the grade-4 form "Spending 4-1"
      seen in third-party crosswalks. NEITHER the numbering nor the wording was
      verifiable in this session, so NO benchmark codes are listed and none may
      be printed. Until someone downloads the PDF and fills this map in, write
      alignment as: "National Standards for Personal Financial Education (2021),
      Topic: Spending (grade 8 benchmarks)" — content area, no number, no quote.
    how_to_cite_safely: >-
      Content-area-only citation is honest, is what most state frameworks
      themselves do, and still earns the search terms teachers use
      ("personal financial literacy standards", "financial literacy standards
      middle school"). Do not invent a benchmark number to look more precise.
    verification_copies:
      - label: "Publisher landing pages and the October 2021 joint release confirm the six topics and the grade 4/8/12 benchmark structure; the benchmark text itself sits inside the PDF, which this session could not fetch."
        url: "https://www.jumpstart.org/education/national-standards/"

  JUMPSTART:
    name: "Jump$tart Coalition — see NSPFE"
    same_as: "NSPFE"
    source: "https://www.jumpstart.org/education/national-standards/"
    primary_source_confirmed: false
    codes: {}
    note: >-
      Alias record, kept because older product copy and docs/STANDARDS.md used to
      say "Jump$tart National Standards in Personal Financial Education (2021)".
      That 2021 document IS the joint CEE/Jump$tart NSPFE — use the NSPFE entry.
      The genuinely Jump$tart-only framework is the retired 4th edition (2015),
      whose six content areas were Financial Responsibility and Decision Making;
      Income and Careers; Planning and Money Management; Credit and Debt; Risk
      Management and Insurance; Saving and Investing. Do not cite the 2015 areas
      as current; not verified here and superseded.
    superseded_edition_verified: false

  CEE:
    name: "Council for Economic Education — see NSPFE"
    same_as: "NSPFE"
    source: "https://www.councilforeconed.org/"
    primary_source_confirmed: false
    codes: {}
    note: >-
      Alias record. CEE's personal-finance standards are the joint NSPFE (2021).
      CEE separately maintains the "Voluntary National Content Standards in
      Economics" (20 numbered standards, benchmarks at grades 4, 8 and 12) —
      a DIFFERENT framework, genuinely useful for the entrepreneurship line
