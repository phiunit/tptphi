  CCSS-ELA:
    name: "Common Core State Standards for English Language Arts & Literacy, grades 6-8 — Reading Informational Text (RI), Writing (W), Speaking & Listening (SL)"
    publisher: "NGA Center for Best Practices / Council of Chief State School Officers"
    source: "https://www.thecorestandards.org/ELA-Literacy/"
    primary_source_confirmed: false
    key_format: >-
      Keys here are the short form teachers recognize (W.7.1, SL.6.4, RI.8.8).
      `full` gives the fully-qualified code. Both are acceptable in a listing;
      use the short form in lesson chips and the full form in the teacher guide.
    do_not_write: >-
      "W.6-8.1" and "SL.6-8.4" are NOT real codes — there is no grade-banded CCSS
      ELA code. Pick the actual grade (W.6.1 / W.7.1 / W.8.1) or list all three.
