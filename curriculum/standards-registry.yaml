not_captured:
  - framework: "State CTE Business / Marketing / Entrepreneurship clusters"
    reason: >-
      Codes are set state by state and change on state revision cycles. A code
      that is real in Texas is invented everywhere else. See the portable-CTE
      section of docs/STANDARDS.md — cite the national Career Cluster by NAME
      (no code) plus CCSS ELA, never a state code the product cannot honour.
  - framework: "CEE Voluntary National Content Standards in Economics (20 standards)"
    reason: "Real and useful for the entrepreneurship line, but verbatim text was not retrievable in this session."
  - framework: "AI4K12 national guidelines (Five Big Ideas in AI)"
    reason: >-
      A guideline framework, not adopted standards; teachers do not search it.
      If it is ever wanted, Code.org carries 2021 and 2023 datasets at
      dashboard/config/standards/ai4k12-2021_standards.csv and
      ai4k12-2023_standards.csv — verify against a second copy first.
  - framework: "NGSS, C3 Social Studies"
    reason: "Out of scope for the four current product lines."

