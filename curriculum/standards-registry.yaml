    status: >-
      NEW. Verbatim text is verified, but almost no state has adopted it yet, so a
      teacher searching TPT is still searching 2017-era language. CITE CSTA (2017)
      AS PRIMARY and add a 2026 code only as a secondary "also aligns to" line.
      Revisit this rule in 2027-2028 as state adoptions land.
    structure_note: >-
      Five concepts replace the 2017 five: Algorithms & Design, Programming,
      Data & Analysis, Systems & Security, Computing & Society. Algorithms is now
      separate from Programming, and AI content is distributed across all five
      concepts rather than sitting in one — which is why this set matters a lot
      to the AI-literacy line (see MS-ALG-PS-05, MS-ALG-ML-06..08, MS-PRO-RD-18,
      MS-SOC-ET-40).
    verification_copies:
      - label: "Code.org production standards data (csta2026_standards.csv)"
        url: "https://raw.githubusercontent.com/code-dot-org/code-dot-org/staging/dashboard/config/standards/csta2026_standards.csv"
