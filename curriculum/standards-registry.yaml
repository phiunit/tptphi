# Verified Standards Registry — Phi Unit TPT Factory
# ---------------------------------------------------------------------------
# SOURCE OF TRUTH for every standards code this store may cite.
# docs/STANDARDS.md explains WHICH framework to use per product line;
# this file is the only place the CODES and their VERBATIM TEXT live.
#
# Never hand-edit a code's `text`. Never add a code without doing the
# verification described in `verification_policy` below and recording it.
# ---------------------------------------------------------------------------
registry_version: 1
generated: "2026-09-03"
grade_band: "6-8 (middle school)"

verification_policy:
  what_verified_true_means: >-
    The exact wording in `text` was retrieved from a machine-readable or
    published copy of the framework and then matched CHARACTER-FOR-CHARACTER
    against at least one INDEPENDENT second copy with different provenance.
    Whitespace, curly-vs-straight quotes and PDF extraction artifacts were
    normalized before comparison; wording, punctuation and word order were not.
  what_verified_false_means: >-
    The code or structure is real and correctly identified, but this session
    could not obtain the publisher's exact benchmark wording. Do NOT print
    quoted standard text for these. See each entry's `note`.
  retrieval_constraint: >-
    The session that built this file could not reach iste.org, csteachers.org,
    corestandards.org, jumpstart.org, councilforeconed.org,
    nationalartsstandards.org or any state DOE host — all were blocked by the
    egress proxy. Verification therefore used (a) publisher-authored copies
    (e.g. an ISTE Press book appendix carrying the ISTE copyright notice),
    (b) exports that carry the publisher's own URIs (corestandards.org URIs),
    and (c) independent curriculum-organization datasets (Code.org, Berkeley
    BJC, state regulation text). Every framework below names its copies.
  re_verify_when_unblocked: >-
    When the official hosts are reachable, re-check every framework against
    the primary PDF and bump `registry_version`. Frameworks with
    `primary_source_confirmed: false` are the priority.
  taught_and_assessed_rule: >-
    A code being present here does NOT license citing it. Per docs/JUDGE.md
    Gate 1, a product may cite a code only if the product both TEACHES it in
    a named activity and ASSESSES it in a named item. Otherwise cut the code.

frameworks:

