  CSTA-2026:
    name: "2026 CSTA PK-12 Computer Science Standards, MS band (middle school)"
    publisher: "Computer Science Teachers Association"
    source: "https://csteachers.org/wp-content/uploads/2026/07/2026-CSTA-PK%E2%80%9312-Computer-Science-Standards.pdf"
