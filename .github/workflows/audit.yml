# Audit as infrastructure (docs/PIPELINE.md): every push and every Monday, the full gauntlet
# runs on a clean machine — render gates, listing/standards/retired-terms validation,
# readability, judge screenshots, previews. Red here means a product is not shippable.
name: audit
on:
  push:
  pull_request:
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install Chromium for playwright-core
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(find ~/.cache/ms-playwright -type f -name chrome | head -1)" >> "$GITHUB_ENV"
      - run: npm run audit
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-shots-and-previews
          path: |
            products/*/dist/review/*.png
            products/*/dist/* - Preview.pdf
          if-no-files-found: ignore
